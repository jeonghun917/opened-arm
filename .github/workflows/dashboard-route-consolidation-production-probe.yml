name: Dashboard Route Consolidation Production Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dashboard-route-consolidation-production-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe production legacy routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://dashboard-control-center.vercel.app"
          code() { curl -sS -o /dev/null -w '%{http_code}' "$@"; }
          health="$(code "$base/api/health")"
          gh_status="$(code "$base/api/github/status")"
          gh_file="$(code "$base/api/github/file?repo=jeonghun917/c3-voice-lab&path=ops/cori-selfheal-state.json")"
          gh_action="$(code -X POST -H 'content-type: application/json' -H 'x-idempotency-key: route-production-probe-gh' --data '{"repo":"jeonghun917/dashboard-control-center","type":"rerun_failed","runId":1}' "$base/api/github/action")"
          li_status="$(code "$base/api/lightning/status")"
          li_action="$(code -X POST -H 'content-type: application/json' -H 'x-idempotency-key: route-production-probe-li' --data '{"type":"stop_job","jobName":"probe"}' "$base/api/lightning/action")"
          test "$health" = 200
          test "$gh_status" = 401
          test "$gh_file" = 401
          test "$gh_action" = 401
          test "$li_status" = 401
          test "$li_action" = 401
          mkdir -p ops
          printf '{\n  "dashboardSha": "fce5a9fe592e2a31eed93b056cdd588cca9dd62c",\n  "deployment": "dpl_A2R5RGxVgz6WKLkQ8hWRinasSq7s",\n  "functionCount": {"node": 8, "python": 1, "total": 9},\n  "health": "%s",\n  "githubStatusLegacy": "%s",\n  "githubFileLegacy": "%s",\n  "githubActionLegacy": "%s",\n  "lightningStatusLegacy": "%s",\n  "lightningActionLegacy": "%s",\n  "runId": "%s"\n}\n' "$health" "$gh_status" "$gh_file" "$gh_action" "$li_status" "$li_action" "$GITHUB_RUN_ID" > ops/dashboard-route-consolidation-production.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add ops/dashboard-route-consolidation-production.json
          git commit -m "Record dashboard route consolidation production probe"
          git push
