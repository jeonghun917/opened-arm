name: Dashboard Schedule Evidence One-shot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dashboard-schedule-evidence-once.yml"

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture recent scheduled runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ops
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/dashboard-control-plane-sync.yml/runs?event=schedule&branch=main&per_page=10" \
            > "$tmp"
          python - "$tmp" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          rows = []
          for r in data.get('workflow_runs', []):
              rows.append({
                  'id': r.get('id'),
                  'event': r.get('event'),
                  'status': r.get('status'),
                  'conclusion': r.get('conclusion'),
                  'createdAt': r.get('created_at'),
                  'runStartedAt': r.get('run_started_at'),
                  'updatedAt': r.get('updated_at'),
                  'headBranch': r.get('head_branch'),
                  'headSha': r.get('head_sha'),
                  'htmlUrl': r.get('html_url'),
              })
          with open('ops/dashboard-scheduled-runs-evidence.json', 'w', encoding='utf-8') as f:
              json.dump({'runs': rows}, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Persist evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add ops/dashboard-scheduled-runs-evidence.json
          if ! git diff --cached --quiet; then
            git commit -m "Record scheduled dashboard sync run evidence"
            git push origin HEAD:main
          fi
