name: AWS Semantic Review Coding Worker PR75 Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aws-semantic-review-coding-worker-pr75-once.yml"

permissions:
  id-token: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_MAX_ATTEMPTS: "1"
      AWS_RETRY_MODE: standard
      SEMANTIC_REVIEW_COUNT: "3"
      SEMANTIC_REVIEW_INPUT: semantic-review-coding-worker-pr75-input.json
      SEMANTIC_REVIEW_OUTPUT: semantic-review-coding-worker-pr75-results.json
      SEMANTIC_REVIEW_MODEL_ID: qwen.qwen3-coder-30b-a3b-v1:0
      TARGET_SHA: 945397b17e83e2bb4e02a73fd114313f3cb7a3cd
      BASE_SHA: ebdbc506e4c34bcc455ca11a4d9b51af1ceb86d4

    steps:
      - name: Check out execution repository
        uses: actions/checkout@v4

      - name: Check out exact private Dashboard PR head
        uses: actions/checkout@v4
        with:
          repository: jeonghun917/dashboard-control-center
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          path: dashboard
          fetch-depth: 0
          persist-credentials: false

      - name: Build exact PR diff
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          git diff --no-ext-diff "$BASE_SHA" "$TARGET_SHA" -- \
            shared/codingWorker.ts \
            scripts/test-coding-worker.ts \
            package.json \
            docs/coding-worker-v0-design.md > ../pr75.diff
          test -s ../pr75.diff
          test "$(git diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort)" = "$(printf '%s\n' docs/coding-worker-v0-design.md package.json scripts/test-coding-worker.ts shared/codingWorker.ts | sort)"

      - name: Build bounded semantic review input
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          code=open('pr75.diff', encoding='utf-8').read()
          req='''Review Dashboard Coding Worker v0 PR #75 at the exact supplied diff. Required properties: repository, branch, exact base SHA, and file mutation policy are caller-owned authority and the reasoner cannot widen them; the normalized execution contract must be SHA-256-bound into Continuity evidence before reasoning; repository ScopeGuard AND file allow/deny rules must both pass; deny overrides allow and delete is opt-in; identity values must never be truncated for comparison; adapter inputs must not share mutable authority state; a claimed applied result must advance the exact base; executor receipts are claims, not proof; deterministic verification must independently establish result commit SHA, exact parent/base, exact target branch HEAD, and exact changed-path set; verification evidence must bind to the result commit; semantic reviewer agreement/confidence never grants PASS/FAIL; successful worker output is candidate-only and cannot close Continuity; no hidden provider mutation authority, automatic retry, merge, deploy, or live GitHub adapter is introduced. Report concrete correctness, authorization, evidence-integrity, data-integrity, trust-boundary, concurrency, failure-handling, or type-contract defects only. Check implementation, regression tests, package wiring, and design-contract consistency. Do not report style preferences or speculative missing context. The supplied code is a unified diff, so line numbers refer to this review input, not original files.'''
          payload={
              'task_id':'dashboard-coding-worker-pr75-semantic-review',
              'language':'TypeScript/JSON/Markdown unified diff',
              'requirements':req,
              'code':code,
          }
          open('semantic-review-coding-worker-pr75-input.json','w',encoding='utf-8').write(json.dumps(payload, ensure_ascii=False))
          print({'review_chars':len(code)})
          PY

      - name: Configure semantic review credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ format('arn:aws:iam::{0}:role/general-ai-semantic-review', vars.AWS_ACCOUNT_ID) }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: opened-arm-coding-worker-pr75-review
          mask-aws-account-id: true
          disable-retry: true

      - name: Run three independent semantic reviewers
        shell: bash
        run: |
          set -euo pipefail
          python3 infra/aws/semantic-review/pool.py

      - name: Verify hypothesis-only contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data=json.load(open('semantic-review-coding-worker-pr75-results.json'))
          assert data['schema']=='semantic-review-pool-v0'
          assert data['authority']=='HYPOTHESIS_ONLY'
          assert data['production_pass_fail_authority'] is False
          assert data['automatic_retry'] is False
          assert data['review_budget']==3
          assert data['completed_reviews']==3
          print(json.dumps({
            'completed_reviews': data['completed_reviews'],
            'finding_count': data['finding_count'],
            'wall_latency_ms': data['wall_latency_ms'],
            'usage': data['usage'],
            'aggregated_findings': data['aggregated_findings'],
          }, ensure_ascii=False))
          PY

      - name: Upload semantic review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-review-coding-worker-pr75
          path: semantic-review-coding-worker-pr75-results.json
          if-no-files-found: ignore
          retention-days: 14
