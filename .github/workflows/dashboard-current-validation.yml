name: Dashboard Current Public Validation

run-name: dashboard-current-validation|sha=${{ github.event_name == 'workflow_dispatch' && inputs.sha || 'target-file' }}|correlation=${{ github.event_name == 'workflow_dispatch' && inputs.correlation_id || '-' }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact dashboard-control-center commit SHA to validate
        required: true
      correlation_id:
        description: Optional opaque dispatch correlation identity
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/dashboard-current-validation.yml"
      - "ops/dashboard-validation-target.txt"

permissions:
  contents: write

concurrency:
  group: dashboard-current-public-validation
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public runner repository
        uses: actions/checkout@v4
        with:
          path: runner-repo
          fetch-depth: 0

      - name: Resolve exact dashboard SHA
        id: target
        shell: bash
        env:
          INPUT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || '' }}
          INPUT_CORRELATION_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.correlation_id || '' }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SHA:-}" ]; then
            target="$INPUT_SHA"
          else
            target="$(tr -d '[:space:]' < runner-repo/ops/dashboard-validation-target.txt)"
          fi
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          correlation_id="${INPUT_CORRELATION_ID:-}"
          python - "$correlation_id" <<'PY'
          import re, sys
          value = sys.argv[1]
          if value and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._:-]{0,127}", value) is None:
              raise SystemExit("correlation_id must be 1-128 characters from [A-Za-z0-9._:-] and start with an alphanumeric character")
          PY
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          printf 'correlation_id=%s\n' "$correlation_id" >> "$GITHUB_OUTPUT"

      - name: Check private checkout credential
        id: credential
        shell: bash
        env:
          DASHBOARD_REPO_TOKEN: ${{ secrets.DASHBOARD_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${DASHBOARD_REPO_TOKEN:-}"

      - name: Publish pending dashboard status
        id: pending_status
        continue-on-error: true
        shell: bash
        env:
          DASHBOARD_REPO_TOKEN: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${DASHBOARD_REPO_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/jeonghun917/dashboard-control-center/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"dashboard-public-validation\",\"description\":\"Public exact-SHA validation started\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            >/dev/null

      - name: Checkout exact private dashboard SHA
        id: checkout
        uses: actions/checkout@v4
        with:
          repository: jeonghun917/dashboard-control-center
          ref: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          path: dashboard
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        id: identity
        shell: bash
        working-directory: dashboard
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "actual_sha=$actual" >> "$GITHUB_OUTPUT"
          test "$actual" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "Checkout credential unexpectedly persisted"
            exit 1
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Clean install
        id: npm_ci
        working-directory: dashboard
        run: npm ci

      - name: Full dashboard check
        id: npm_check
        working-directory: dashboard
        run: npm run check

      - name: Publish final dashboard status
        id: final_status
        if: always() && steps.target.outputs.sha != ''
        continue-on-error: true
        shell: bash
        env:
          DASHBOARD_REPO_TOKEN: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGET_STATUS: ${{ steps.target.outcome }}
          CREDENTIAL_STATUS: ${{ steps.credential.outcome }}
          CHECKOUT_STATUS: ${{ steps.checkout.outcome }}
          IDENTITY_STATUS: ${{ steps.identity.outcome }}
          NPM_CI_STATUS: ${{ steps.npm_ci.outcome }}
          NPM_CHECK_STATUS: ${{ steps.npm_check.outcome }}
        run: |
          set -euo pipefail
          state=failure
          description="Public exact-SHA validation failed"
          if [ "$TARGET_STATUS" = success ] && \
             [ "$CREDENTIAL_STATUS" = success ] && \
             [ "$CHECKOUT_STATUS" = success ] && \
             [ "$IDENTITY_STATUS" = success ] && \
             [ "$NPM_CI_STATUS" = success ] && \
             [ "$NPM_CHECK_STATUS" = success ]; then
            state=success
            description="npm ci + npm run check passed"
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${DASHBOARD_REPO_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/jeonghun917/dashboard-control-center/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"${state}\",\"context\":\"dashboard-public-validation\",\"description\":\"${description}\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            >/dev/null

      - name: Persist validation evidence
        if: always()
        shell: bash
        working-directory: runner-repo
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          ACTUAL_SHA: ${{ steps.identity.outputs.actual_sha }}
          TARGET_STATUS: ${{ steps.target.outcome }}
          CREDENTIAL_STATUS: ${{ steps.credential.outcome }}
          PENDING_STATUS: ${{ steps.pending_status.outcome }}
          CHECKOUT_STATUS: ${{ steps.checkout.outcome }}
          IDENTITY_STATUS: ${{ steps.identity.outcome }}
          NPM_CI_STATUS: ${{ steps.npm_ci.outcome }}
          NPM_CHECK_STATUS: ${{ steps.npm_check.outcome }}
          FINAL_STATUS: ${{ steps.final_status.outcome }}
          CORRELATION_ID: ${{ steps.target.outputs.correlation_id }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          mkdir -p ops
          python - <<'PY'
          import json, os
          payload = {
              "schema": 2,
              "targetSha": os.environ.get("TARGET_SHA", ""),
              "actualSha": os.environ.get("ACTUAL_SHA", ""),
              "targetResolution": os.environ.get("TARGET_STATUS", ""),
              "credentialGate": os.environ.get("CREDENTIAL_STATUS", ""),
              "pendingStatusPublish": os.environ.get("PENDING_STATUS", ""),
              "privateCheckout": os.environ.get("CHECKOUT_STATUS", ""),
              "identityCheck": os.environ.get("IDENTITY_STATUS", ""),
              "npmCi": os.environ.get("NPM_CI_STATUS", ""),
              "npmRunCheck": os.environ.get("NPM_CHECK_STATUS", ""),
              "finalStatusPublish": os.environ.get("FINAL_STATUS", ""),
              "statusContext": "dashboard-public-validation",
              "runId": os.environ.get("GITHUB_RUN_ID", ""),
              "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "correlationId": os.environ.get("CORRELATION_ID") or None,
          }
          contents = json.dumps(payload, ensure_ascii=False, indent=2) + "\n"
          with open("ops/dashboard-current-validation.json", "w", encoding="utf-8") as f:
              f.write(contents)
          with open(os.path.join(os.environ["RUNNER_TEMP"], "dashboard-current-validation.json"), "w", encoding="utf-8") as f:
              f.write(contents)
          PY
          git add ops/dashboard-current-validation.json
          if ! git diff --cached --quiet; then
            git commit -m "Record current dashboard validation result"
            git push origin HEAD:main
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-current-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dashboard-current-validation.json
          if-no-files-found: error
          retention-days: 14

      - name: Require status publication
        if: always()
        shell: bash
        env:
          PENDING_STATUS: ${{ steps.pending_status.outcome }}
          FINAL_STATUS: ${{ steps.final_status.outcome }}
        run: |
          set -euo pipefail
          test "$PENDING_STATUS" = success
          test "$FINAL_STATUS" = success
