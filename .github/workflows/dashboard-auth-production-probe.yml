name: Dashboard Auth Production Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dashboard-auth-production-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe and persist anonymous write-route evidence
        shell: bash
        run: |
          set -euo pipefail
          base="https://dashboard-control-center.vercel.app"
          gh_code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H 'x-idempotency-key: anonymous-production-probe-github' \
            --data '{"repo":"jeonghun917/dashboard-control-center","type":"rerun_failed","runId":1}' \
            "$base/api/github/action")"
          li_code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H 'x-idempotency-key: anonymous-production-probe-lightning' \
            --data '{"type":"stop_job","jobName":"probe"}' \
            "$base/api/lightning/action")"
          test "$gh_code" = 401
          test "$li_code" = 401
          mkdir -p ops
          printf '{\n  "githubActionAnonymousStatus": "%s",\n  "lightningActionAnonymousStatus": "%s",\n  "expected": "401",\n  "runId": "%s"\n}\n' "$gh_code" "$li_code" "$GITHUB_RUN_ID" > ops/dashboard-auth-production-probe.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add ops/dashboard-auth-production-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Record dashboard auth production probe"
            git push
          fi
