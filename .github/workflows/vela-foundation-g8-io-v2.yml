name: VELA Foundation G8 durable I/O v2

on:
  push:
    branches: [vela-foundation-ci]
    paths:
      - 'ops/vela-foundation-g8-io-v2-trigger.txt'
      - '.github/workflows/vela-foundation-g8-io-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vela-foundation-g8-io-v2
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public runner-control branch
        uses: actions/checkout@v4
        with:
          ref: vela-foundation-ci
          path: runner-control
          persist-credentials: true
      - name: Checkout private Ars-Mentis source
        uses: actions/checkout@v4
        with:
          repository: jeonghun917/Ars-Mentis
          ref: vela-foundation-runtime
          token: ${{ secrets.ARS_MENTIS_READ_TOKEN }}
          path: ars-mentis
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run durable repository benchmark
        shell: bash
        env:
          VELA_RESULT_PATH: /tmp/vela-foundation-g8-io-v2.json
        run: |
          set +e
          (cd ars-mentis && PYTHONPATH=src python tools/g8_durable_io_benchmark.py) > /tmp/g8-io.log 2>&1
          status=$?
          set -e
          source_commit=$(git -C ars-mentis rev-parse HEAD)
          if [[ ! -f /tmp/vela-foundation-g8-io-v2.json ]]; then
            SOURCE_COMMIT="$source_commit" TEST_STATUS="$status" python - <<'PY'
          import json, os
          with open('/tmp/vela-foundation-g8-io-v2.json','w',encoding='utf-8') as f:
              json.dump({'status':'FAIL_BEFORE_RESULT','source_commit':os.environ['SOURCE_COMMIT'],'exit_code':int(os.environ['TEST_STATUS'])},f,indent=2)
              f.write('\n')
          PY
          fi
          SOURCE_COMMIT="$source_commit" python - <<'PY'
          import json, os
          p='/tmp/vela-foundation-g8-io-v2.json'
          row=json.load(open(p,encoding='utf-8'))
          row['source_repository']='jeonghun917/Ars-Mentis'
          row['source_ref']='vela-foundation-runtime'
          row['source_commit']=os.environ['SOURCE_COMMIT']
          json.dump(row,open(p,'w',encoding='utf-8'),indent=2,sort_keys=True)
          open(p,'a').write('\n')
          print(json.dumps({'status':row.get('status'),'summary':row.get('summary'),'source_commit':row.get('source_commit')},indent=2))
          PY
          exit "$status"
      - name: Record public result snapshot
        if: always()
        shell: bash
        run: |
          mkdir -p runner-control/ops
          cp /tmp/vela-foundation-g8-io-v2.json runner-control/ops/vela-foundation-g8-io-v2-latest.json
          cd runner-control
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/vela-foundation-g8-io-v2-latest.json
          git diff --cached --quiet || git commit -m 'Record VELA foundation G8 durable I/O v2 [skip ci]'
          for n in 1 2 3 4 5; do
            git pull --rebase origin vela-foundation-ci && git push origin HEAD:vela-foundation-ci && break
            sleep $((n*3))
          done
