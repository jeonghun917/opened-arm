name: Project AI Execution Pools v0

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'runner/ai_execution_pool.py'
      - 'runner/semantic_review_pool_adapter.py'
      - 'infra/aws/semantic-review/pool.py'
      - 'infra/aws/semantic-review/model-selection.json'
      - 'ops/ai-execution-pools-v0.json'
      - 'docs/project-ai-execution-pools-v0.md'
      - '.github/workflows/project-ai-execution-pools-v0.yml'

permissions:
  contents: read

jobs:
  deterministic-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compile pool core and adapters
        run: python3 -m py_compile runner/ai_execution_pool.py runner/semantic_review_pool_adapter.py infra/aws/semantic-review/pool.py

      - name: Verify allocation, transferred contracts and common ledger
        run: python3 runner/ai_execution_pool.py self-test

      - name: Verify semantic review result binding
        run: python3 runner/semantic_review_pool_adapter.py self-test

      - name: Verify registration remains fail-closed where authority is missing
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('ops/ai-execution-pools-v0.json').read_text())
          assert data['status'] == 'CONFIG_REQUIRED'
          assert data['handoff']['messageId'] == 'shared-execution-contract-handoff-v0'
          assert data['handoff']['status'] == 'CONSUMED'
          assert data['handoff']['result'] == 'DONE'
          assert data['allocation']['globalFifoHeadBlocking'] is False
          assert data['allocation']['projectPolicies'] == {}
          assert data['budget']['initialProjectBudgets'] == {}
          assert data['budget']['paidModelCalls'] == 'EXPLICIT_APPROVAL_ONLY'
          assert data['budget']['automaticPaidRetries'] is False
          assert data['ledger']['commonAcrossTaskTypes'] is True
          coding = data['codingWorkerContract']
          assert coding['status'] == 'CONTRACT_READY_EXECUTION_CONFIG_REQUIRED'
          assert coding['authorityOverrideForbidden'] is True
          assert coding['executionReceipt']['failedExecutionMayCloseWithoutCommit'] is True
          assert coding['executionReceipt']['failedExecutionVerificationRequired'] is False
          assert coding['executionReceipt']['appliedExecutionCommitRequired'] is True
          assert coding['requiresIndependentReview'] is True
          assert coding['mayCloseContinuity'] is False
          assert data['executionPlaneContract']['status'] == 'CONTRACT_READY'
          assert data['executionPlaneContract']['paidRouteRequiresManualApproval'] is True
          assert data['executionPlaneContract']['retryFailClosed'] is True
          assert data['authority']['codingWorkerMayWidenAuthority'] is False
          assert data['authority']['aiReviewResultAuthority'] == 'HYPOTHESIS_ONLY'
          assert data['authority']['aiReviewMayMerge'] is False
          store = data['adapters']['durableAllocatorStore']
          assert store['status'] == 'CONFIG_REQUIRED'
          assert store['ownerProjectId'] == 'shared-platform'
          assert store['backendRef'] is None
          print('registration contract: PASS')
          PY
