name: Dashboard PR21 Clean Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dashboard-pr21-clean-check.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: 8fec65da9a87bd8356124824bf78cef9f14e2b75
    steps:
      - name: Checkout public runner repository
        uses: actions/checkout@v4
        with:
          path: runner-repo
          fetch-depth: 1

      - name: Checkout exact dashboard SHA
        id: dashboard_checkout
        uses: actions/checkout@v4
        with:
          repository: jeonghun917/dashboard-control-center
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          path: dashboard
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact SHA
        id: identity
        shell: bash
        working-directory: dashboard
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "actual_sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          test "$ACTUAL_SHA" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Clean install
        id: npm_ci
        working-directory: dashboard
        run: npm ci

      - name: Full check
        id: npm_check
        working-directory: dashboard
        run: npm run check

      - name: Persist result
        if: always()
        shell: bash
        working-directory: runner-repo
        env:
          JOB_STATUS: ${{ job.status }}
          ACTUAL_SHA: ${{ steps.identity.outputs.actual_sha }}
          CHECKOUT_STATUS: ${{ steps.dashboard_checkout.outcome }}
          IDENTITY_STATUS: ${{ steps.identity.outcome }}
          NPM_CI_STATUS: ${{ steps.npm_ci.outcome }}
          NPM_CHECK_STATUS: ${{ steps.npm_check.outcome }}
        run: |
          set -euo pipefail
          mkdir -p ops
          python - <<'PY'
          import json, os
          payload = {
              "targetSha": os.environ.get("TARGET_SHA", ""),
              "actualSha": os.environ.get("ACTUAL_SHA", ""),
              "jobStatus": os.environ.get("JOB_STATUS", ""),
              "privateCheckout": os.environ.get("CHECKOUT_STATUS", ""),
              "identityCheck": os.environ.get("IDENTITY_STATUS", ""),
              "npmCi": os.environ.get("NPM_CI_STATUS", ""),
              "npmRunCheck": os.environ.get("NPM_CHECK_STATUS", ""),
              "runId": os.environ.get("GITHUB_RUN_ID", ""),
          }
          with open("ops/dashboard-pr21-clean-check.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/dashboard-pr21-clean-check.json
          if git diff --cached --quiet; then
            echo "Result unchanged"
          else
            git commit -m "Record dashboard PR21 clean check"
            git push origin HEAD:main
          fi
