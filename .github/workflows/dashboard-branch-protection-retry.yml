name: Dashboard Branch Protection Retry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dashboard-branch-protection-retry.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and verify dashboard main protection
        id: protection
        shell: bash
        env:
          DASHBOARD_REPO_TOKEN: ${{ secrets.DASHBOARD_REPO_TOKEN }}
        run: |
          set -uo pipefail
          api="https://api.github.com/repos/jeonghun917/dashboard-control-center/branches/main/protection"
          request_body='{"required_status_checks":{"strict":true,"contexts":["dashboard-public-validation"]},"enforce_admins":true,"required_pull_request_reviews":{"dismiss_stale_reviews":true,"require_code_owner_reviews":false,"required_approving_review_count":0,"require_last_push_approval":false},"restrictions":null,"required_linear_history":true,"allow_force_pushes":false,"allow_deletions":false,"block_creations":false,"required_conversation_resolution":true,"lock_branch":false,"allow_fork_syncing":false}'
          put_body="$(mktemp)"
          get_body="$(mktemp)"
          trap 'rm -f "$put_body" "$get_body"' EXIT

          if [ -z "${DASHBOARD_REPO_TOKEN:-}" ]; then
            put_code=000
            get_code=000
            printf '{"message":"DASHBOARD_REPO_TOKEN missing"}' > "$put_body"
            printf '{}' > "$get_body"
          else
            put_code="$(curl --silent --show-error --output "$put_body" --write-out '%{http_code}' \
              --request PUT \
              --header "Authorization: Bearer ${DASHBOARD_REPO_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$api" \
              --data "$request_body")"
            get_code="$(curl --silent --show-error --output "$get_body" --write-out '%{http_code}' \
              --header "Authorization: Bearer ${DASHBOARD_REPO_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$api")"
          fi

          mkdir -p ops
          PUT_CODE="$put_code" GET_CODE="$get_code" PUT_BODY="$put_body" GET_BODY="$get_body" python - <<'PY'
          import json, os
          def load(path):
              try:
                  with open(path, encoding='utf-8') as f:
                      return json.load(f)
              except Exception:
                  return {}
          put = load(os.environ['PUT_BODY'])
          data = load(os.environ['GET_BODY'])
          checks = data.get('required_status_checks') or {}
          contexts = checks.get('contexts') or []
          reviews = data.get('required_pull_request_reviews') or {}
          payload = {
              'applyHttp': os.environ.get('PUT_CODE', ''),
              'verifyHttp': os.environ.get('GET_CODE', ''),
              'requiredStatusChecks': contexts,
              'strictStatusChecks': checks.get('strict'),
              'enforceAdmins': (data.get('enforce_admins') or {}).get('enabled'),
              'pullRequestRequired': bool(reviews),
              'requiredApprovingReviewCount': reviews.get('required_approving_review_count'),
              'dismissStaleReviews': reviews.get('dismiss_stale_reviews'),
              'requiredLinearHistory': (data.get('required_linear_history') or {}).get('enabled'),
              'allowForcePushes': (data.get('allow_force_pushes') or {}).get('enabled'),
              'allowDeletions': (data.get('allow_deletions') or {}).get('enabled'),
              'requiredConversationResolution': (data.get('required_conversation_resolution') or {}).get('enabled'),
              'errorMessage': put.get('message') if os.environ.get('PUT_CODE') != '200' else None,
              'runId': os.environ.get('GITHUB_RUN_ID', ''),
          }
          payload['verified'] = (
              payload['applyHttp'] == '200' and
              payload['verifyHttp'] == '200' and
              payload['strictStatusChecks'] is True and
              'dashboard-public-validation' in contexts and
              payload['enforceAdmins'] is True and
              payload['pullRequestRequired'] is True and
              payload['requiredApprovingReviewCount'] == 0 and
              payload['requiredLinearHistory'] is True and
              payload['allowForcePushes'] is False and
              payload['allowDeletions'] is False and
              payload['requiredConversationResolution'] is True
          )
          with open('ops/dashboard-branch-protection-result.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print(json.dumps(payload, ensure_ascii=False))
          PY

      - name: Persist evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add ops/dashboard-branch-protection-result.json
          if ! git diff --cached --quiet; then
            git commit -m "Record dashboard branch protection result"
            git push origin HEAD:main
          fi

      - name: Require verified protection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          data = json.load(open('ops/dashboard-branch-protection-result.json', encoding='utf-8'))
          assert data.get('verified') is True, data
          PY
