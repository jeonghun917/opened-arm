name: VELA R2 RWKV7 2.9B RunPod prep v0

on:
  push:
    branches: [exp/vela-r2-2p9b-runpod-prep-v0]
    paths:
      - '.github/workflows/vela-r2-2p9b-full-control-v0.yml'
      - 'experiments/vela-active-state/r2-2p9b-full-control-v0/RUNPOD_RUNNER_SPEC.json'
      - 'experiments/vela-active-state/r2-2p9b-full-control-v0/runpod_preflight.py'
      - 'experiments/vela-active-state/r2-2p9b-full-control-v0/runpod_launch.sh'
      - 'experiments/vela-active-state/r2-2p9b-full-control-v0/validate_runpod_prep.py'
      - 'experiments/vela-active-state/r2-2p9b-full-control-v0/RUNPOD_PREFLIGHT_SPEC_V1.json'
      - 'experiments/vela-active-state/r2-2p9b-full-control-v0/runpod_state_roundtrip_v1.py'
      - 'experiments/vela-active-state/r2-2p9b-full-control-v0/runpod_preflight_launch_v1.sh'
      - 'experiments/vela-active-state/r2-2p9b-full-control-v0/validate_runpod_preflight_v1.py'
      - 'experiments/vela-active-state/r2-2p9b-full-control-v0/RUNPOD_PREFLIGHT_ATTEMPT_01.json'
      - 'experiments/vela-active-state/r2-2p9b-full-control-v0/RUNPOD_PREFLIGHT_ATTEMPT_02.json'
      - 'experiments/vela-active-state/r2-2p9b-full-control-v0/runpod_state_roundtrip_diagnostic_v2.py'
      - 'experiments/vela-active-state/r2-2p9b-full-control-v0/RUNPOD_DIAGNOSTIC_SPEC_V2.json'
      - 'experiments/vela-active-state/r2-2p9b-full-control-v0/runpod_state_diagnostic_launch_v2.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vela-r2-2p9b-runpod-prep-v0
  cancel-in-progress: false

env:
  EXPERIMENT_DIR: experiments/vela-active-state/r2-2p9b-full-control-v0
  SOURCE_KAGGLE_HEAD: a1cb641b17436f5376df682db57243b75320bdeb

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify prep-only mutation scope and frozen science
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_KAGGLE_HEAD" "$GITHUB_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_KAGGLE_HEAD" "$GITHUB_SHA" | sort)
          printf 'changed=%s\n' "${changed[*]}"
          allowed=(
            '.github/workflows/vela-r2-2p9b-full-control-v0.yml'
            'experiments/vela-active-state/r2-2p9b-full-control-v0/RUNPOD_RUNNER_SPEC.json'
            'experiments/vela-active-state/r2-2p9b-full-control-v0/runpod_launch.sh'
            'experiments/vela-active-state/r2-2p9b-full-control-v0/runpod_preflight.py'
            'experiments/vela-active-state/r2-2p9b-full-control-v0/validate_runpod_prep.py'
            'experiments/vela-active-state/r2-2p9b-full-control-v0/RUNPOD_PREFLIGHT_SPEC_V1.json'
            'experiments/vela-active-state/r2-2p9b-full-control-v0/runpod_state_roundtrip_v1.py'
            'experiments/vela-active-state/r2-2p9b-full-control-v0/runpod_preflight_launch_v1.sh'
            'experiments/vela-active-state/r2-2p9b-full-control-v0/validate_runpod_preflight_v1.py'
            'experiments/vela-active-state/r2-2p9b-full-control-v0/RUNPOD_PREFLIGHT_ATTEMPT_01.json'
            'experiments/vela-active-state/r2-2p9b-full-control-v0/RUNPOD_PREFLIGHT_ATTEMPT_02.json'
            'experiments/vela-active-state/r2-2p9b-full-control-v0/runpod_state_roundtrip_diagnostic_v2.py'
            'experiments/vela-active-state/r2-2p9b-full-control-v0/RUNPOD_DIAGNOSTIC_SPEC_V2.json'
            'experiments/vela-active-state/r2-2p9b-full-control-v0/runpod_state_diagnostic_launch_v2.sh'
          )
          for p in "${changed[@]}"; do
            ok=0
            for a in "${allowed[@]}"; do [[ "$p" == "$a" ]] && ok=1; done
            [[ "$ok" == 1 ]] || { echo "::error::unexpected path $p"; exit 1; }
          done
          check_blob() { [[ "$(git hash-object "$1")" == "$2" ]] || { echo "::error::frozen blob drift $1"; exit 1; }; }
          check_blob "$EXPERIMENT_DIR/MODEL_STIMULI_INDEX.json" 95b2371ac7bb9416ad5b9a7d33f2df4de40d4d4c
          check_blob "$EXPERIMENT_DIR/EVALUATOR.json" 55d28e6564396408f293f67ebabfc258e41ae9ef
          check_blob "$EXPERIMENT_DIR/EXTERNAL_TRACE.json" fb056e547feaedfead6b2bb67f87e31449d21466
          check_blob "$EXPERIMENT_DIR/PROTOCOL.json" 3dbf20fd96082221c90e348d15d943d5213ec8d1
          check_blob "$EXPERIMENT_DIR/science_common.py" 77cee99a8ff131b31165521fa8c9cfb76a7ce174
          check_blob "$EXPERIMENT_DIR/condition_runner.py" 70b696bcfdb3ba7fc7f4010a1143aac1063c452b
          check_blob "$EXPERIMENT_DIR/aggregate.py" ac86908be386b0159f52bcf45d4dd0e0786daae4
          check_blob "$EXPERIMENT_DIR/gpu_preflight.py" 7f3801df39f0689fd4135730f4c15c780f9ebab9
          check_blob "$EXPERIMENT_DIR/stimuli/episode_1.json" 9b91ed85c5a3f0e1495fbcda627b660857743235
          check_blob "$EXPERIMENT_DIR/stimuli/episode_2.json" 22e590dd8318ac64cc12bd3d41fc765e6ce7db46
          check_blob "$EXPERIMENT_DIR/stimuli/episode_3.json" 426055ca45b40476e0baa9917c72a7d1aba0332f
          check_blob "$EXPERIMENT_DIR/stimuli/episode_4.json" fb232b0b6683276d8d323cc306071d7e5cf83f55
          check_blob "$EXPERIMENT_DIR/stimuli/episode_5.json" 8c00d81963e25f998348aac88ebdf92d45077e95
          check_blob "$EXPERIMENT_DIR/stimuli/episode_6.json" 8091870b4f8ac512ac835d9db48f16a80033ad15
      - name: Validate state diagnostic v2 instrumentation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$EXPERIMENT_DIR/runpod_state_roundtrip_diagnostic_v2.py"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('experiments/vela-active-state/r2-2p9b-full-control-v0')
          s=json.loads((p/'RUNPOD_DIAGNOSTIC_SPEC_V2.json').read_text())
          assert s['schema']=='vela-runpod-state-diagnostic-spec:v2'
          assert s['phase']=='STATE_DIAGNOSTIC_ONLY'
          assert s['scientificExecutionAuthorized'] is False
          assert s['automaticRetry'] is False and s['fallbackProviders']==[]
          assert s['target']['gpuId']=='NVIDIA A40' and s['target']['cloud']=='SECURE'
          assert s['budget']['maxPodCount']==1 and s['budget']['maxTotalUsd']==0.50
          launch=(p/'runpod_state_diagnostic_launch_v2.sh').read_text()
          for required in ['VELA_RUNPOD_DIAGNOSTIC_AUTHORIZED','NVIDIA A40','GPU_PRICE_CAP="0.49"','--cloud-type SECURE','--ssh=false','pod delete','WORKLOAD_TIMEOUT_SECONDS=1200']:
              assert required in launch, required
          for forbidden in ['MODEL_STIMULI_INDEX','EVALUATOR.json','EXTERNAL_TRACE.json','VELA_CONDITION','condition_runner.py','aggregate.py']:
              assert forbidden not in (p/'runpod_state_roundtrip_diagnostic_v2.py').read_text(), forbidden
          PY
      - name: Revalidate frozen P-R2-02 contract
        run: python "$EXPERIMENT_DIR/validate_contract.py"
      - name: Validate RunPod preflight v1 gate
        run: python "$EXPERIMENT_DIR/validate_runpod_preflight_v1.py"

  runpod-readiness:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check RunPod setup without paid mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/runpod-readiness
          if [[ -z "${RUNPOD_API_KEY:-}" ]]; then
            printf '%s\n' '{"status":"SECRET_NOT_CONFIGURED","provider":"RUNPOD","paid_mutation":false}' > /tmp/runpod-readiness/readiness.json
            cat /tmp/runpod-readiness/readiness.json
            exit 0
          fi
          curl -fsSL https://cli.runpod.net | sudo bash
          runpodctl version > /tmp/runpod-readiness/runpodctl-version.txt
          runpodctl user >/dev/null
          runpodctl gpu list --include-unavailable > /tmp/runpod-readiness/gpu-list.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/runpod-readiness')
          g=json.loads((p/'gpu-list.json').read_text())
          (p/'readiness.json').write_text(json.dumps({
              'status':'AUTH_AND_INVENTORY_PASS','provider':'RUNPOD','paid_mutation':False,
              'gpu_inventory_observed':True,'gpu_inventory_type':type(g).__name__,
          },sort_keys=True)+'\n')
          PY
          cat /tmp/runpod-readiness/readiness.json
      - name: Upload non-scientific RunPod readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vela-r2-02-runpod-readiness
          path: /tmp/runpod-readiness
          if-no-files-found: error
          retention-days: 14

  runpod-preflight:
    needs: [contract, runpod-readiness]
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[runpod-preflight-authorized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      VELA_SOURCE_COMMIT: ${{ github.sha }}
      VELA_RUNPOD_PREFLIGHT_AUTHORIZED: 'true'
      VELA_EVIDENCE_DIR: /tmp/runpod-preflight-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact current RunPod CLI
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}"
          curl -fsSL https://cli.runpod.net | sudo bash
          runpodctl version
      - name: Execute one result-blind A40 preflight
        shell: bash
        run: bash "$EXPERIMENT_DIR/runpod_preflight_launch_v1.sh"
      - name: Validate preflight envelope
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          p=os.path.join(os.environ['VELA_EVIDENCE_DIR'],'preflight-envelope.json')
          r=json.load(open(p))
          assert r['status']=='PASS' and r['scientific_evidence'] is False
          assert r['phase']=='PREFLIGHT_ONLY' and r['pod_deleted'] is True
          assert r['estimated_gpu_cost_upper_bound_usd'] <= 0.50
          assert r['gpu']['gpuId']=='NVIDIA A40'
          assert r['state_roundtrip']['state']['serialize_restore_exact'] is True
          assert r['state_roundtrip']['state']['continuation_logits_exact'] is True
          assert r['state_roundtrip']['state']['continuation_state_exact'] is True
          PY
      - name: Upload authoritative RunPod preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vela-r2-02-runpod-preflight-v1
          path: /tmp/runpod-preflight-evidence
          if-no-files-found: error
          retention-days: 30

  runpod-state-diagnostic:
    needs: [contract, runpod-readiness]
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[runpod-diagnostic-authorized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      VELA_SOURCE_COMMIT: ${{ github.sha }}
      VELA_RUNPOD_DIAGNOSTIC_AUTHORIZED: 'true'
      VELA_DIAGNOSTIC_EVIDENCE_DIR: /tmp/runpod-diagnostic-v2-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact current RunPod CLI
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}"
          curl -fsSL https://cli.runpod.net | sudo bash
          runpodctl version
      - name: Execute one A40 state diagnostic v2
        shell: bash
        run: bash "$EXPERIMENT_DIR/runpod_state_diagnostic_launch_v2.sh"
      - name: Validate diagnostic envelope
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          p=os.path.join(os.environ['VELA_DIAGNOSTIC_EVIDENCE_DIR'],'diagnostic-envelope.json')
          r=json.load(open(p))
          assert r['status']=='DIAGNOSTIC_COMPLETE'
          assert r['scientific_evidence'] is False and r['phase']=='STATE_DIAGNOSTIC_ONLY'
          assert r['pod_deleted'] is True and r['estimated_gpu_cost_upper_bound_usd'] <= 0.50
          assert r['gpu']['gpuId']=='NVIDIA A40'
          d=r['diagnostic']
          assert d['status']=='DIAGNOSTIC_COMPLETE' and d['scientific_evidence'] is False
          assert d['classification'] in {
            'SERIALIZATION_DEFECT','BASE_RUNTIME_NONDETERMINISM_OR_MODEL_MUTATION',
            'RESTORED_RUNTIME_NONDETERMINISM','NO_DIVERGENCE_REPRODUCED',
            'RESTORE_SPECIFIC_EXECUTION_DIVERGENCE'
          }
          PY
      - name: Upload authoritative state diagnostic v2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vela-r2-02-runpod-state-diagnostic-v2
          path: /tmp/runpod-diagnostic-v2-evidence
          if-no-files-found: error
          retention-days: 30
