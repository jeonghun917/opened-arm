name: VELA R2 Emergency Stop

on:
  push:
    branches: [exp/vela-r2-2p9b-runpod-prep-v0]
    paths:
      - '.github/workflows/vela-r2-2p9b-full-control-v0.yml'

permissions:
  contents: read

concurrency:
  group: vela-r2-2p9b-runpod-prep-v0
  cancel-in-progress: true

jobs:
  force-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Install pinned runpodctl
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/runpodctl https://github.com/runpod/runpodctl/releases/download/v2.14.0/runpodctl-linux-amd64
          echo '2e0fd370a52a0fc7e43a6434a209348a4f6836fcdf1ad2b093b609e938138be9  /tmp/runpodctl' | sha256sum -c -
          chmod +x /tmp/runpodctl
          sudo mv /tmp/runpodctl /usr/local/bin/runpodctl
          runpodctl version
      - name: Delete exact science pods
        shell: bash
        run: |
          set -euo pipefail
          for id in klon6wtdga8b2q 8l5h6gbp617ixa 437paq5odhz7a3 2bk2l1xb1ria8a; do
            echo "deleting $id"
            runpodctl pod delete "$id" || true
          done
          sleep 2
          failed=0
          for id in klon6wtdga8b2q 8l5h6gbp617ixa 437paq5odhz7a3 2bk2l1xb1ria8a; do
            if runpodctl pod get "$id" >/tmp/get-$id.out 2>/tmp/get-$id.err; then
              echo "STILL_EXISTS $id" >&2
              cat /tmp/get-$id.out >&2 || true
              failed=1
            else
              echo "ABSENT $id"
            fi
          done
          exit "$failed"
