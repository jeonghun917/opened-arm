name: VELA R2 RWKV7 2.9B full-control v0

on:
  push:
    branches: [exp/vela-r2-2p9b-full-control-v0]
    paths:
      - 'experiments/vela-active-state/r2-2p9b-full-control-v0/**'
      - '.github/workflows/vela-r2-2p9b-full-control-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vela-r2-2p9b-full-control-v0-contract
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact source commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - name: Validate frozen scientific contract
        run: python experiments/vela-active-state/r2-2p9b-full-control-v0/validate_contract.py
