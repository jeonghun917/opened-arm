name: VELA R2 Modal GPU smoke v0

on:
  push:
    branches: [infra/vela-r2-2p9b-modal-smoke-v0]
    paths:
      - '.github/workflows/vela-r2-2p9b-full-control-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vela-r2-2p9b-modal-smoke-v0
  cancel-in-progress: true

jobs:
  modal-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Modal credentials are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}" || { echo '::error::MODAL_TOKEN_ID is not available to this repository'; exit 2; }
          test -n "${MODAL_TOKEN_SECRET:-}" || { echo '::error::MODAL_TOKEN_SECRET is not available to this repository'; exit 2; }
          echo 'Modal credential pair is present; values intentionally not printed.'

      - name: Install Modal client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet modal
          modal --version
          modal token info

      - name: Build ephemeral Modal GPU probe
        shell: bash
        run: |
          cat > /tmp/vela_modal_smoke.py <<'PY'
          import json
          import os
          import subprocess
          import modal

          app = modal.App('vela-r2-2p9b-modal-smoke-v0')

          @app.function(gpu='L4', timeout=180)
          def gpu_probe():
              query = subprocess.check_output(
                  [
                      'nvidia-smi',
                      '--query-gpu=name,memory.total,driver_version',
                      '--format=csv,noheader,nounits',
                  ],
                  text=True,
              ).strip()
              return {
                  'status': 'PASS',
                  'scientific_evidence': False,
                  'provider': 'modal',
                  'gpu_request': 'L4',
                  'nvidia_smi': query,
                  'cuda_visible_devices': os.environ.get('CUDA_VISIBLE_DEVICES'),
              }

          @app.local_entrypoint()
          def main():
              result = gpu_probe.remote()
              print('VELA_MODAL_SMOKE_JSON=' + json.dumps(result, sort_keys=True))
          PY

      - name: Run one tiny L4 GPU allocation
        shell: bash
        run: |
          set -euo pipefail
          modal run /tmp/vela_modal_smoke.py | tee /tmp/modal-smoke.log
          grep '^VELA_MODAL_SMOKE_JSON=' /tmp/modal-smoke.log > /tmp/modal-smoke-result.txt
          python - <<'PY'
          import json
          from pathlib import Path
          line = Path('/tmp/modal-smoke-result.txt').read_text().strip()
          result = json.loads(line.split('=', 1)[1])
          assert result['status'] == 'PASS', result
          assert result['scientific_evidence'] is False, result
          assert result['provider'] == 'modal', result
          assert result['gpu_request'] == 'L4', result
          Path('/tmp/modal-smoke-result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload non-scientific smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vela-r2-02-modal-gpu-smoke-v0
          path: |
            /tmp/modal-smoke.log
            /tmp/modal-smoke-result.json
          if-no-files-found: warn
          retention-days: 7
