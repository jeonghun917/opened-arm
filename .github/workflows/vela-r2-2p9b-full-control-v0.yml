name: VELA R2 Emergency Stop

on:
  push:
    branches: [exp/vela-r2-2p9b-runpod-prep-v0]
    paths:
      - '.github/workflows/vela-r2-2p9b-full-control-v0.yml'

permissions:
  contents: read

concurrency:
  group: vela-r2-2p9b-runpod-prep-v0
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Emergency stop sentinel
        run: echo 'Cancelling prior run in concurrency group; no provider mutation.'
