name: VELA R2 RWKV7 2.9B RunPod orchestration v4

on:
  push:
    branches: [exp/vela-r2-2p9b-runpod-prep-v0]
    paths:
      - '.github/workflows/vela-r2-2p9b-full-control-v0.yml'
      - 'experiments/vela-active-state/r2-2p9b-full-control-v0/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vela-r2-2p9b-runpod-prep-v0
  cancel-in-progress: false

env:
  EXPERIMENT_DIR: experiments/vela-active-state/r2-2p9b-full-control-v0
  SOURCE_KAGGLE_HEAD: a1cb641b17436f5376df682db57243b75320bdeb
  RUNPODCTL_SHA256: 2e0fd370a52a0fc7e43a6434a209348a4f6836fcdf1ad2b093b609e938138be9

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen science and proxy transport v4
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_KAGGLE_HEAD" "$GITHUB_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_KAGGLE_HEAD" "$GITHUB_SHA" | sort)
          for p in "${changed[@]}"; do
            case "$p" in
              '.github/workflows/vela-r2-2p9b-full-control-v0.yml'|experiments/vela-active-state/r2-2p9b-full-control-v0/*) ;;
              *) echo "::error::unexpected path $p"; exit 1;;
            esac
          done
          check_blob() { [[ "$(git hash-object "$1")" == "$2" ]] || { echo "::error::frozen blob drift $1"; exit 1; }; }
          check_blob "$EXPERIMENT_DIR/MODEL_STIMULI_INDEX.json" 95b2371ac7bb9416ad5b9a7d33f2df4de40d4d4c
          check_blob "$EXPERIMENT_DIR/EVALUATOR.json" 55d28e6564396408f293f67ebabfc258e41ae9ef
          check_blob "$EXPERIMENT_DIR/EXTERNAL_TRACE.json" fb056e547feaedfead6b2bb67f87e31449d21466
          check_blob "$EXPERIMENT_DIR/PROTOCOL.json" 3dbf20fd96082221c90e348d15d943d5213ec8d1
          check_blob "$EXPERIMENT_DIR/science_common.py" 77cee99a8ff131b31165521fa8c9cfb76a7ce174
          check_blob "$EXPERIMENT_DIR/condition_runner.py" 70b696bcfdb3ba7fc7f4010a1143aac1063c452b
          check_blob "$EXPERIMENT_DIR/aggregate.py" ac86908be386b0159f52bcf45d4dd0e0786daae4
          check_blob "$EXPERIMENT_DIR/gpu_preflight.py" 7f3801df39f0689fd4135730f4c15c780f9ebab9
          check_blob "$EXPERIMENT_DIR/runpod_condition_adapter_v1.py" fd5145246a519ae45992df21b6c3acdf7ede5273
          check_blob "$EXPERIMENT_DIR/stimuli/episode_1.json" 9b91ed85c5a3f0e1495fbcda627b660857743235
          check_blob "$EXPERIMENT_DIR/stimuli/episode_2.json" 22e590dd8318ac64cc12bd3d41fc765e6ce7db46
          check_blob "$EXPERIMENT_DIR/stimuli/episode_3.json" 426055ca45b40476e0baa9917c72a7d1aba0332f
          check_blob "$EXPERIMENT_DIR/stimuli/episode_4.json" fb232b0b6683276d8d323cc306071d7e5cf83f55
          check_blob "$EXPERIMENT_DIR/stimuli/episode_5.json" 8c00d81963e25f998348aac88ebdf92d45077e95
          check_blob "$EXPERIMENT_DIR/stimuli/episode_6.json" 8091870b4f8ac512ac835d9db48f16a80033ad15
          bash -n "$EXPERIMENT_DIR/install_runpodctl_pinned_v1.sh"
          bash -n "$EXPERIMENT_DIR/runpod_science_condition_launch_v4.sh"
          python -m py_compile \
            "$EXPERIMENT_DIR/runpod_condition_adapter_v1.py" \
            "$EXPERIMENT_DIR/runpod_select_a40_capacity_v1.py" \
            "$EXPERIMENT_DIR/runpod_science_proxy_supervisor_v1.py" \
            "$EXPERIMENT_DIR/test_runpod_science_proxy_v1.py" \
            "$EXPERIMENT_DIR/test_runpod_science_launcher_v4.py"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('experiments/vela-active-state/r2-2p9b-full-control-v0')
          alloc=json.loads((p/'RUNPOD_SCIENCE_ALLOCATION_REPAIR_V3.json').read_text())
          trans=json.loads((p/'RUNPOD_SCIENCE_TRANSPORT_REPAIR_V4.json').read_text())
          auth=json.loads((p/'RUNPOD_SCIENCE_MATRIX_AUTH_V1.json').read_text())
          assert alloc['status']=='PREPARED_UNARMED' and alloc['allocation']['matrixMaxParallel']==1
          assert trans['schema']=='vela-runpod-science-transport-repair:v4'
          assert trans['status']=='PREPARED_UNARMED' and trans['scientificExecutionAuthorized'] is False
          assert trans['transport']['primary']=='RUNPOD_HTTPS_PROXY_V1'
          assert trans['transport']['containerLogsRequiredForCorrectness'] is False
          assert trans['transport']['containerLogsRequiredForCleanup'] is False
          assert trans['containerLifecycle']['controlPlaneUptimeResetDeletesPodImmediately'] is True
          assert trans['scienceContract']['adapterFrozenGitBlob']=='fd5145246a519ae45992df21b6c3acdf7ede5273'
          assert auth['status'] in {'CONSUMED_INCOMPLETE','AUTHORIZED_MATRIX'}
          assert auth['scientificResultExists'] is False
          if auth['status']=='AUTHORIZED_MATRIX':
              assert auth['attemptOrdinal'] >= 5
              assert auth['maxPodCount']==5 and float(auth['maxTotalUsd']) <= 0.40
              assert auth['maxRuntimeSecondsPerPod']==480
              assert auth['automaticRetry'] is False and auth['fallbackProviders']==[]
          launcher=(p/'runpod_science_condition_launch_v4.sh').read_text()
          for x in ['MAX_RUNTIME_SECONDS=480','WORKLOAD_TIMEOUT_SECONDS=420','PROXY_STARTUP_GRACE_SECONDS=120',
                    '--ports "${RESULT_PORT}/http"','proxy.runpod.net','RESULT_FETCHED_VIA_RUNPOD_HTTPS_PROXY',
                    'CONTAINER_RESTART_DETECTED_BY_CONTROL_PLANE','result-token-sha256.txt','cleanup_pod']:
              assert x in launcher, x
          assert 'pod logs' not in launcher
          supervisor=(p/'runpod_science_proxy_supervisor_v1.py').read_text()
          for x in ['ThreadingHTTPServer','/v1/status/','/v1/result/','CONTAINER_RESTART_AFTER_SCIENCE_START_NO_VALID_RESULT','serve_forever']:
              assert x in supervisor, x
          wf=Path('.github/workflows/vela-r2-2p9b-full-control-v0.yml').read_text()
          assert 'max-parallel: 1' in wf
          assert 'runpod_science_condition_launch_v4.sh' in wf
          PY
      - name: Synthetic HTTPS proxy transport proof
        run: python "$EXPERIMENT_DIR/test_runpod_science_proxy_v1.py"
      - name: Synthetic controller success and restart fail-close proof
        run: python "$EXPERIMENT_DIR/test_runpod_science_launcher_v4.py"
      - name: Revalidate frozen P-R2-02 contract
        run: python "$EXPERIMENT_DIR/validate_contract.py"
      - name: Revalidate preflight contract
        run: python "$EXPERIMENT_DIR/validate_runpod_preflight_v1.py"

  runpod-readiness:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned RunPod CLI and read provider state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/runpod-readiness /tmp/runpod-cli
          test -n "${RUNPOD_API_KEY:-}"
          bash "$EXPERIMENT_DIR/install_runpodctl_pinned_v1.sh" /tmp/runpod-cli/runpodctl
          /tmp/runpod-cli/runpodctl user >/dev/null
          /tmp/runpod-cli/runpodctl gpu list --include-unavailable > /tmp/runpod-readiness/gpu-list.json
          /tmp/runpod-cli/runpodctl pod create --help > /tmp/runpod-readiness/pod-create-help.txt
          grep -q -- '--data-center-ids' /tmp/runpod-readiness/pod-create-help.txt
          grep -q -- '--ports string' /tmp/runpod-readiness/pod-create-help.txt
          cp /tmp/runpodctl-version.txt /tmp/runpod-readiness/runpodctl-version.txt
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/runpod-readiness'); g=json.loads((p/'gpu-list.json').read_text()); rows=g if isinstance(g,list) else g.get('gpus',g.get('items',[])); a40=next((x for x in rows if x.get('gpuId')=='NVIDIA A40'),None)
          if not a40: raise SystemExit('A40_NOT_LISTED')
          p.joinpath('readiness.json').write_text(json.dumps({'status':'AUTH_INVENTORY_AND_PROXY_PORT_PASS','provider':'RUNPOD','paid_mutation':False,'runpodctl':'2.14.0','runpodctl_sha256':'2e0fd370a52a0fc7e43a6434a209348a4f6836fcdf1ad2b093b609e938138be9','httpProxyPortFlag':True,'a40':a40},sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vela-r2-02-runpod-readiness
          path: /tmp/runpod-readiness
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: vela-runpodctl-v2.14.0-linux-amd64
          path: /tmp/runpod-cli/runpodctl
          if-no-files-found: error
          retention-days: 1

  runpod-science-auth-gate:
    needs: [contract, runpod-readiness]
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[runpod-science-authorized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate attempt authorization only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('experiments/vela-active-state/r2-2p9b-full-control-v0/RUNPOD_SCIENCE_MATRIX_AUTH_V1.json').read_text())
          assert a['status']=='AUTHORIZED_MATRIX'
          assert a['attemptOrdinal'] >= 5
          assert a['maxPodCount']==5 and float(a['maxTotalUsd']) <= 0.40
          assert a['maxRuntimeSecondsPerPod']==480
          assert a['automaticRetry'] is False and a['fallbackProviders']==[]
          assert a['conditions']==['B','C','G','M','X']
          PY

  runpod-science:
    needs: [runpod-readiness, runpod-science-auth-gate]
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[runpod-science-authorized]') }}
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        condition: [B, C, G, M, X]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      VELA_SOURCE_COMMIT: ${{ github.sha }}
      VELA_CONDITION: ${{ matrix.condition }}
      VELA_RUNPOD_SCIENCE_AUTHORIZED: 'true'
      VELA_SCIENCE_EVIDENCE_DIR: /tmp/runpod-science-${{ matrix.condition }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: vela-runpodctl-v2.14.0-linux-amd64
          path: /tmp/runpod-cli
      - name: Install exact pinned CLI
        run: |
          set -euo pipefail
          echo "$RUNPODCTL_SHA256  /tmp/runpod-cli/runpodctl" | sha256sum -c -
          chmod +x /tmp/runpod-cli/runpodctl
          sudo install -m 0755 /tmp/runpod-cli/runpodctl /usr/local/bin/runpodctl
          runpodctl version
      - name: Fresh-read A40 capacity for this shard
        run: |
          set -euo pipefail
          mkdir -p /tmp/shard-capacity
          runpodctl gpu list --include-unavailable > /tmp/shard-capacity/gpu-list.json
          python "$EXPERIMENT_DIR/runpod_select_a40_capacity_v1.py" /tmp/shard-capacity/gpu-list.json /tmp/shard-capacity/selection.json
          cat /tmp/shard-capacity/selection.json
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          x=json.load(open('/tmp/shard-capacity/selection.json'))
          assert x['status']=='PASS' and x['paid_mutation'] is False
          print('VELA_RUNPOD_DATA_CENTER_ID='+x['selectedDataCenter']['dataCenterId'])
          PY
      - name: Execute exact scientific condition through HTTPS proxy transport
        run: bash "$EXPERIMENT_DIR/runpod_science_condition_launch_v4.sh"
      - name: Validate condition evidence envelope
        run: |
          python - <<'PY'
          import json,os
          d=os.environ['VELA_SCIENCE_EVIDENCE_DIR']; c=os.environ['VELA_CONDITION']; source=os.environ['VELA_SOURCE_COMMIT']
          e=json.load(open(os.path.join(d,f'condition_envelope_{c}.json'))); r=json.load(open(os.path.join(d,f'condition_result_{c}.json')))
          assert e['status']=='PASS' and e['scientific_evidence'] is True and e['pod_deleted'] is True
          assert e['max_runtime_seconds']==480 and e['estimated_gpu_cost_upper_bound_usd'] <= 0.07
          assert e['gpu']['gpuId']=='NVIDIA A40'
          assert e['gpu']['selectedDataCenter']['stockStatus'] in {'High','Medium'}
          assert e['transport']=='RUNPOD_HTTPS_PROXY_V1'
          assert e['transport_terminal_reason']=='RESULT_FETCHED_VIA_RUNPOD_HTTPS_PROXY'
          assert r['status']=='P-R2-02_CONDITION_RESULT' and r['scientific_evidence'] is True
          assert r['condition']==c and r['source_commit']==source
          assert 'A40' in r['runtime']['device'] and r['runtime']['device_capability']==[8,6]
          assert set(r['scales'])=={'0.4B','2.9B'}
          PY
      - name: Upload exact shard and provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vela-r2-02-runpod-science-${{ matrix.condition }}
          path: /tmp/runpod-science-${{ matrix.condition }}
          if-no-files-found: warn
          retention-days: 30

  runpod-provider-cleanup:
    needs: [runpod-readiness, runpod-science]
    if: ${{ always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[runpod-science-authorized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vela-runpodctl-v2.14.0-linux-amd64
          path: /tmp/runpod-cli
      - name: Delete any exact-candidate science pods left behind
        run: |
          set -euo pipefail
          echo "$RUNPODCTL_SHA256  /tmp/runpod-cli/runpodctl" | sha256sum -c -
          chmod +x /tmp/runpod-cli/runpodctl
          prefix="vela-p-r2-02-science-"; suffix="-${GITHUB_SHA:0:10}"
          /tmp/runpod-cli/runpodctl pod list --all > /tmp/pods-before.json
          python - /tmp/pods-before.json "$prefix" "$suffix" > /tmp/delete-ids.txt <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1])); rows=data if isinstance(data,list) else data.get('pods',data.get('items',[]))
          for x in rows:
              if isinstance(x,dict):
                  name=str(x.get('name') or '')
                  if name.startswith(sys.argv[2]) and name.endswith(sys.argv[3]): print(x.get('id') or x.get('podId'))
          PY
          while read -r id; do [[ -n "$id" ]] && /tmp/runpod-cli/runpodctl pod delete "$id" || true; done < /tmp/delete-ids.txt
          sleep 2
          /tmp/runpod-cli/runpodctl pod list --all > /tmp/pods-after.json
          python - /tmp/pods-after.json "$prefix" "$suffix" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1])); rows=data if isinstance(data,list) else data.get('pods',data.get('items',[])); remain=[]
          for x in rows:
              if isinstance(x,dict):
                  name=str(x.get('name') or '')
                  if name.startswith(sys.argv[2]) and name.endswith(sys.argv[3]): remain.append({'id':x.get('id') or x.get('podId'),'name':name})
          print(json.dumps({'remaining':remain},sort_keys=True))
          if remain: raise SystemExit(1)
          PY

  runpod-science-aggregate:
    needs: [runpod-science, runpod-provider-cleanup]
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[runpod-science-authorized]') && needs.runpod-science.result == 'success' && needs.runpod-provider-cleanup.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: vela-r2-02-runpod-science-*
          path: /tmp/runpod-science-shards
      - name: Aggregate exact five-condition scientific result
        run: |
          set -euo pipefail
          mkdir -p /tmp/runpod-science-aggregate
          python "$EXPERIMENT_DIR/aggregate.py" /tmp/runpod-science-shards
          mv scientific_result.json /tmp/runpod-science-aggregate/scientific_result.json
          python - <<'PY'
          import json,os
          r=json.load(open('/tmp/runpod-science-aggregate/scientific_result.json'))
          assert r['status']=='P-R2-02_RESULT' and r['scientific_evidence'] is True
          assert r['source_commit']==os.environ['GITHUB_SHA']
          assert r['shard_conditions']==['B','C','G','M','X']
          assert set(r['scales'])=={'0.4B','2.9B'}
          assert r['primary_hypothesis_status'] in {'SUPPORTED','MIXED','NOT_SUPPORTED','PROTOCOL_BLOCKED'}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vela-r2-02-runpod-scientific-result
          path: /tmp/runpod-science-aggregate
          if-no-files-found: error
          retention-days: 30
