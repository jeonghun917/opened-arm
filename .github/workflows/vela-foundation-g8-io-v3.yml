name: VELA Foundation G8 durable I/O v3

on:
  push:
    branches: [vela-foundation-ci]
    paths:
      - 'ops/vela-foundation-g8-io-v3-trigger.txt'
      - '.github/workflows/vela-foundation-g8-io-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vela-foundation-g8-io-v3
  cancel-in-progress: false

env:
  EXPECTED_ARS_COMMIT: e3bbee3d5dd5057b52c2d7ea624f943f68f9065b

jobs:
  durable-io:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vela-foundation-ci
          path: runner-control
          persist-credentials: true

      - uses: actions/checkout@v4
        with:
          repository: jeonghun917/Ars-Mentis
          ref: ${{ env.EXPECTED_ARS_COMMIT }}
          token: ${{ secrets.ARS_MENTIS_READ_TOKEN }}
          path: ars-mentis
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ars-mentis rev-parse HEAD)" = "$EXPECTED_ARS_COMMIT"

      - name: Run local durable repository I/O benchmark
        shell: bash
        run: |
          set +e
          (cd ars-mentis && PYTHONPATH=src VELA_RESULT_PATH=/tmp/g8.json python tools/g8_durable_io_benchmark.py) > /tmp/g8.log 2>&1
          status=$?
          set -e
          mkdir -p runner-control/ops
          SOURCE_COMMIT="$EXPECTED_ARS_COMMIT" TEST_STATUS="$status" python - <<'PY'
          import json, os
          from pathlib import Path
          source = Path('/tmp/g8.json')
          if source.exists():
              benchmark = json.loads(source.read_text())
          else:
              benchmark = {'status': 'FAIL_BEFORE_BENCHMARK_RESULT'}
          passed = os.environ['TEST_STATUS'] == '0' and bool(benchmark.get('summary', {}).get('all_roundtrip_ok')) and bool(benchmark.get('summary', {}).get('recovery_clean'))
          payload = {
              'status': 'PASS_LOCAL_DURABLE_FILE_IO' if passed else 'FAIL',
              'overall_g8_gate_recommendation': 'PARTIAL',
              'policy_freeze_allowed': False,
              'source_repository': 'jeonghun917/Ars-Mentis',
              'source_commit': os.environ['SOURCE_COMMIT'],
              'benchmark': benchmark,
              'claim_boundary': (
                  'Current-source integration check of FileCheckpointRepository on one CI runner filesystem. '
                  'It is not a production object store/database result and does not authorize freezing fixed_n2.'
              ),
          }
          Path('runner-control/ops/vela-foundation-g8-io-v3-latest.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps({
              'status': payload['status'],
              'overall_g8_gate_recommendation': payload['overall_g8_gate_recommendation'],
              'policy_freeze_allowed': payload['policy_freeze_allowed'],
              'source_commit': payload['source_commit'],
          }, indent=2, sort_keys=True))
          PY
          cat /tmp/g8.log
          exit "$status"

      - name: Commit public result snapshot
        if: always()
        working-directory: runner-control
        shell: bash
        run: |
          if [[ ! -f ops/vela-foundation-g8-io-v3-latest.json ]]; then
            mkdir -p ops
            printf '{"status":"FAIL_BEFORE_RESULT","source_commit":"%s"}\n' "$EXPECTED_ARS_COMMIT" > ops/vela-foundation-g8-io-v3-latest.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/vela-foundation-g8-io-v3-latest.json
          git diff --cached --quiet || git commit -m 'Record VELA foundation G8 durable I/O v3 [skip ci]'
          for n in 1 2 3 4 5; do
            git pull --rebase origin vela-foundation-ci && git push origin HEAD:vela-foundation-ci && break
            sleep $((n*3))
          done
