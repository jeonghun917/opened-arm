name: AWS Semantic Review Intake

on:
  pull_request:
    paths:
      - '.github/workflows/aws-semantic-review-intake.yml'
      - 'infra/aws/semantic-review/pool.py'
      - 'ops/semantic-review-pool-de.py'
  workflow_dispatch:
    inputs:
      payload_b64:
        description: Base64-encoded semantic review request JSON
        required: true
        type: string
      review_count:
        description: Exact number of independent semantic reviewers in this batch
        required: true
        default: '3'
        type: choice
        options:
          - '3'
      dry_run:
        description: Validate the request contract without invoking Bedrock
        required: true
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  validate_definition:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate parser definition and malformed-output boundaries
        run: |
          set -euo pipefail
          python3 -m py_compile infra/aws/semantic-review/pool.py infra/aws/test_semantic_review_intake.py ops/semantic-review-pool-de.py
          python3 infra/aws/semantic-review/pool.py --parser-self-test
          python3 -m unittest infra/aws/test_semantic_review_intake.py
          SEMANTIC_REVIEW_COUNT=2 python3 ops/semantic-review-pool-de.py --parser-self-test

  review:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_MAX_ATTEMPTS: '1'
      AWS_RETRY_MODE: standard
      SEMANTIC_REVIEW_COUNT: ${{ inputs.review_count }}
      SEMANTIC_REVIEW_MODEL_ID: qwen.qwen3-coder-30b-a3b-v1:0
      SEMANTIC_REVIEW_INPUT: semantic-review-input.json
      SEMANTIC_REVIEW_OUTPUT: semantic-review-pool-results.json
      SEMANTIC_REVIEW_INTAKE_OUTPUT: semantic-review-intake-result.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode and validate complete model-budgeted review request
        env:
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          python3 infra/aws/semantic-review/pool.py --validate-intake

      - name: Mask AWS identifiers
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          echo "::add-mask::${AWS_ACCOUNT_ID}"
          echo "::add-mask::arn:aws:iam::${AWS_ACCOUNT_ID}:role/general-ai-semantic-review"

      - name: Configure semantic review credentials via OIDC
        if: ${{ inputs.dry_run == false }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ format('arn:aws:iam::{0}:role/general-ai-semantic-review', vars.AWS_ACCOUNT_ID) }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: opened-arm-semantic-review-intake
          mask-aws-account-id: true
          disable-retry: true

      - name: Run bounded semantic review pool
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          python3 infra/aws/semantic-review/pool.py

      - name: Verify semantic review result contract
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          expected = int(os.environ['SEMANTIC_REVIEW_COUNT'])
          data = json.loads(Path('semantic-review-pool-results.json').read_text())
          intake = json.loads(Path('semantic-review-intake-result.json').read_text())
          assert intake['schema'] == 'semantic-review-intake-v1'
          assert intake['completeness'] is True
          assert intake['provider_invocation_allowed'] is True
          assert intake['automatic_retry'] is False
          assert intake['review_budget'] == 3
          assert intake['coding_calls'] == 0
          assert data['schema'] == 'semantic-review-pool-v0'
          assert data['authority'] == 'HYPOTHESIS_ONLY'
          assert data['production_pass_fail_authority'] is False
          assert data['automatic_retry'] is False
          assert data['review_budget'] == expected
          assert data['coding_calls'] == 0
          assert data['completed_reviews'] == expected
          assert data['next_gate'] == 'deterministic_verification_required'
          print(json.dumps({
              'task_id': data.get('task_id'),
              'completed_reviews': data.get('completed_reviews'),
              'finding_count': data.get('finding_count'),
              'usage': data.get('usage'),
          }))
          PY

      - name: Upload review result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-review-intake-v0-${{ inputs.review_count }}
          path: |
            semantic-review-intake-result.json
            semantic-review-pool-results.json
          if-no-files-found: error
          retention-days: 14
