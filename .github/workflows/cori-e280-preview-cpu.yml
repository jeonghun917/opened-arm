name: Cori E280 CPU Asset Vault

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cori-e280-cpu-asset-vault
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inspect-and-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
      LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Lightning credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LIGHTNING_USER_ID" || { echo 'missing LIGHTNING_USER_ID'; exit 2; }
          test -n "$LIGHTNING_API_KEY" || { echo 'missing LIGHTNING_API_KEY'; exit 2; }
      - name: Syntax check
        run: python -m py_compile runner/lightning_cori_asset_vault.py
      - name: Install Lightning client
        run: python -m pip install --upgrade lightning-sdk
      - name: Start CPU Studio, inspect shared storage, and archive canonical originals
        run: python runner/lightning_cori_asset_vault.py
      - name: Upload metadata-only inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cori-lightning-asset-vault-report
          path: lightning-cori-asset-vault-report.txt
          if-no-files-found: warn
          retention-days: 7
