name: Cori D01 E200 E280 Seed Sweep

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cori-d01-e200-e280-seed-sweep
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
      LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LIGHTNING_USER_ID"
          test -n "$LIGHTNING_API_KEY"
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
      - name: Syntax check
        run: |
          python -m py_compile runner/stage_cori_e200_e280_for_d01_sweep.py
          python -m py_compile runner/synthesize_cori_d01_seed_sweep.py
      - name: Install provider clients
        run: python -m pip install --upgrade lightning-sdk modal
      - name: Stage SHA-verified E200 and E280 to Modal
        run: python runner/stage_cori_e200_e280_for_d01_sweep.py
      - name: Run CPU-only D01 seed sweep
        run: modal run runner/synthesize_cori_d01_seed_sweep.py --output-dir cori_d01_seed_sweep
      - name: Verify diagnostic output
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p = json.loads(Path('cori_d01_seed_sweep/result.json').read_text())
          assert p['ok'] is True and p['gpu_allocated'] is False
          rows = list(csv.DictReader(Path('cori_d01_seed_sweep/diagnostic_metrics.csv').open()))
          assert len(rows) == 10
          assert {r['checkpoint'] for r in rows} == {'E200', 'E280'}
          assert {int(r['seed']) for r in rows} == {1004, 2004, 3004, 4004, 5004}
          print('C3_D01_SEED_SWEEP_PASS')
          PY
      - name: Upload metadata and metrics
        uses: actions/upload-artifact@v4
        with:
          name: cori-d01-seed-sweep-metrics
          path: |
            cori-d01-stage-report.json
            cori_d01_seed_sweep/diagnostic_metrics.csv
            cori_d01_seed_sweep/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload temporary listening pack
        uses: actions/upload-artifact@v4
        with:
          name: cori-d01-seed-sweep-audio
          path: cori_d01_seed_sweep/cori-d01-seed-sweep.zip
          if-no-files-found: error
          retention-days: 7
      - name: Remove local checkpoint copies
        if: always()
        shell: bash
        run: rm -rf cori_d01_stage
