name: AWS Qwen Coding Worker Reasoner

on:
  pull_request:
    paths:
      - '.github/workflows/aws-qwen-coding-reasoner.yml'
      - 'infra/aws/coding-worker/reasoner.py'
      - 'infra/aws/producer_receipt.py'
      - 'infra/aws/test_paid_producer_receipts.py'
  workflow_dispatch:
    inputs:
      payload_b64:
        description: Base64-encoded gzip or legacy JSON bounded Coding Worker request
        required: true
        type: string
      dry_run:
        description: Validate the request without invoking Bedrock
        required: true
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Compile bounded reasoner
        run: python3 -m py_compile infra/aws/coding-worker/reasoner.py infra/aws/producer_receipt.py infra/aws/test_paid_producer_receipts.py
      - name: Run deterministic reasoner self-test
        run: |
          python3 infra/aws/coding-worker/reasoner.py --self-test
          python3 infra/aws/test_paid_producer_receipts.py
      - name: Test exact workflow decoder without provider access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, os, subprocess, sys, tempfile, textwrap
          from pathlib import Path
          workflow = Path('.github/workflows/aws-qwen-coding-reasoner.yml').read_text()
          section = workflow.split('      - name: Decode bounded request\n', 1)[1]
          code = textwrap.dedent(section.split("          python3 - <<'PY'\n", 1)[1].split('          PY\n', 1)[0])
          original = b'{"source":"' + b'x' * 100000 + b'"}'
          compressed = gzip.compress(original, mtime=0)
          cases = [
              ('gzip exact bytes', base64.b64encode(compressed).decode(), original),
              ('legacy JSON', base64.b64encode(b'{"goal":"legacy"}').decode(), b'{"goal":"legacy"}'),
              ('decoded boundary', base64.b64encode(gzip.compress(b'x' * 131072)).decode(), b'x' * 131072),
              ('decoded overflow', base64.b64encode(gzip.compress(b'x' * 131073)).decode(), None),
              ('truncated gzip', base64.b64encode(compressed[:-3]).decode(), None),
              ('malformed gzip', base64.b64encode(b'\x1f\x8b' + b'invalid' * 4).decode(), None),
              ('encoded overflow', 'A' * 65536, None),
              ('invalid Base64', '!!!', None),
          ]
          for name, payload, expected in cases:
              with tempfile.TemporaryDirectory() as directory:
                  result = subprocess.run([sys.executable, '-c', code], cwd=directory,
                      env={**os.environ, 'PAYLOAD_B64': payload}, capture_output=True, timeout=5)
                  output = Path(directory) / 'coding-reasoner-input.json'
                  if expected is None:
                      assert result.returncode != 0 and not output.exists(), name
                  else:
                      assert result.returncode == 0, (name, result.stderr.decode())
                      assert output.read_bytes() == expected, name
          print('Bounded workflow decoder: 8 checks PASS; provider calls 0')
          PY

  reason:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_MAX_ATTEMPTS: '1'
      AWS_RETRY_MODE: standard
      CODING_REASONER_INPUT: coding-reasoner-input.json
      CODING_REASONER_OUTPUT: coding-reasoner-result.json
      CODING_REASONER_INTAKE_OUTPUT: coding-reasoner-intake-result.json
    steps:
      - uses: actions/checkout@v4
      - name: Decode bounded request
        env:
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, io, os, zlib
          from pathlib import Path
          raw = os.environ.get('PAYLOAD_B64', '')
          if not raw or len(raw) > 65535:
              raise SystemExit('payload_b64_missing_or_too_large')
          try:
              decoded = base64.b64decode(raw, validate=True)
          except Exception as exc:
              raise SystemExit(f'payload_b64_invalid:{exc}')
          if decoded.startswith(b'\x1f\x8b'):
              try:
                  with gzip.GzipFile(fileobj=io.BytesIO(decoded)) as compressed:
                      decoded = compressed.read(131073)
              except (OSError, EOFError, zlib.error) as exc:
                  raise SystemExit(f'payload_gzip_invalid:{exc}')
          if len(decoded) > 131072:
              raise SystemExit('decoded_payload_too_large')
          Path('coding-reasoner-input.json').write_bytes(decoded)
          PY
      - name: Validate request contract without model call
        if: ${{ inputs.dry_run == true }}
        run: python3 infra/aws/coding-worker/reasoner.py --validate-request
      - name: Mask AWS identifiers
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          echo "::add-mask::${AWS_ACCOUNT_ID}"
          echo "::add-mask::arn:aws:iam::${AWS_ACCOUNT_ID}:role/general-ai-semantic-review"
      - name: Configure Bedrock credentials via OIDC
        if: ${{ inputs.dry_run == false }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ format('arn:aws:iam::{0}:role/general-ai-semantic-review', vars.AWS_ACCOUNT_ID) }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: opened-arm-qwen-coding-reasoner
          mask-aws-account-id: true
          disable-retry: true
      - name: Invoke proposal-only Qwen reasoner once
        if: ${{ inputs.dry_run == false }}
        run: python3 infra/aws/coding-worker/reasoner.py
      - name: Verify result contract
        if: ${{ inputs.dry_run == false && always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('coding-reasoner-result.json').read_text())
          assert data['schema'] == 'qwen-coding-reasoner-v0'
          assert data['model_id'] == 'qwen.qwen3-coder-30b-a3b-v1:0'
          assert data['authority'] == 'PROPOSAL_ONLY'
          assert data['mutation_authority'] is False
          assert data['production_pass_fail_authority'] is False
          assert data['automatic_retry'] is False
          assert data['proposal']['decision'] in ('PROPOSE', 'ESCALATE')
          receipt = data.get('producer_receipt')
          assert data['next_gate'] == (
              'producer_receipt_incomplete_stop'
              if receipt is not None and receipt['completeness']['complete'] is False
              else 'coding_worker_scope_guard_executor_and_deterministic_verifier'
          )
          if receipt is not None:
              assert receipt['schema'] == 'opened-arm-paid-producer-receipt-v1'
              assert receipt['version'] == 1
              assert receipt['producer_kind'] == 'CODING_REASONER'
              assert receipt['authority'] == 'PROPOSAL_ONLY'
              assert receipt['automatic_retry'] is False
              assert receipt['workflow']['run_id'] == int('${{ github.run_id }}')
              assert receipt['workflow']['run_attempt'] == int('${{ github.run_attempt }}')
              assert receipt['producer']['source_sha'] == '${{ github.sha }}'
              assert receipt['output']['finish_reason'] is not None or receipt['final']['state'] == 'FAILED'
          print(json.dumps({'task_id': data['proposal']['taskId'], 'decision': data['proposal']['decision'], 'mutation_count': len(data['proposal']['mutations']), 'usage': data['usage']}))
          PY
      - name: Upload reasoner result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-coding-reasoner-v0
          path: |
            coding-reasoner-intake-result.json
            coding-reasoner-result.json
          if-no-files-found: error
          retention-days: 14
