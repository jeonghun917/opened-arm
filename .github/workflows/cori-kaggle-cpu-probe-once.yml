name: Cori Kaggle CPU Environment Probe Once

on:
  push:
    branches: [main]
    paths:
      - 'ops/kaggle-cpu-probe-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI on GitHub runner
        run: python -m pip install --quiet --upgrade kaggle
      - name: Build CPU-only Kaggle probe
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo 'missing Kaggle token'; exit 2; }
          rm -rf probe probe_out
          mkdir probe
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path
          token=os.environ['KAGGLE_API_TOKEN']
          req=urllib.request.Request(
              'https://www.kaggle.com/api/v1/oauth2/introspect',
              data=urllib.parse.urlencode({'token':token}).encode(),
              headers={'Content-Type':'application/x-www-form-urlencoded'},
              method='POST',
          )
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          owner=(data.get('username') or '').strip()
          if not data.get('active') or not owner: raise SystemExit('inactive Kaggle token')
          kernel=f'{owner}/c3-cori-network-env-probe'
          Path('probe/probe.py').write_text(r'''import ctypes.util
          import importlib.metadata as md
          import json
          import platform
          import shutil
          import socket
          import subprocess
          import sys
          import urllib.request
          from pathlib import Path

          print('C3_PROBE_SCHEMA=kaggle-api-network-env-v3')
          print('C3_PROBE_PYTHON='+sys.version.replace('\\n',' '))
          print('C3_PROBE_PLATFORM='+platform.platform())
          for host in ['archive.ubuntu.com','security.ubuntu.com','pypi.org','github.com','download.pytorch.org']:
              try:
                  rows=socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)
                  print('C3_PROBE_DNS',host,'PASS',sorted({r[4][0] for r in rows})[:4])
              except Exception as e:
                  print('C3_PROBE_DNS',host,'FAIL',type(e).__name__,str(e)[:300])
          for url in ['https://pypi.org/simple/','https://github.com/','https://download.pytorch.org/whl/cu121/']:
              try:
                  with urllib.request.urlopen(url,timeout=8) as r:
                      print('C3_PROBE_HTTP',url,'PASS',getattr(r,'status',None))
              except Exception as e:
                  print('C3_PROBE_HTTP',url,'FAIL',type(e).__name__,str(e)[:300])
          for command in ['espeak-ng','espeak','ffmpeg','git','gcc','g++','make']:
              print('C3_PROBE_BIN',command,shutil.which(command) or 'MISSING')
          for lib in ['espeak-ng','espeak','sndfile']:
              print('C3_PROBE_LIB',lib,ctypes.util.find_library(lib) or 'MISSING')
          packages=['torch','torchaudio','torchvision','lightning','pytorch-lightning','torchmetrics','phonemizer','librosa','soundfile','numpy','scipy','hydra-core','hydra-colorlog','omegaconf','einops','cython','packaging','rootutils','rich','inflect','Unidecode','conformer','diffusers','pandas','matplotlib']
          for pkg in packages:
              try: print('C3_PROBE_PKG',pkg,md.version(pkg))
              except md.PackageNotFoundError: print('C3_PROBE_PKG',pkg,'MISSING')
          try:
              import torch
              print('C3_PROBE_TORCH',json.dumps({'version':torch.__version__,'cuda_version':torch.version.cuda,'cuda_available':torch.cuda.is_available()}))
          except Exception as e:
              print('C3_PROBE_TORCH_IMPORT_FAIL',type(e).__name__,str(e)[:500])
          for pkg in ['espeak-ng','espeak','ffmpeg','libsndfile1','git','build-essential']:
              p=subprocess.run(['dpkg-query','-W','-f=${Status} ${Version}',pkg],text=True,capture_output=True)
              print('C3_PROBE_DPKG',pkg,p.returncode,(p.stdout or p.stderr).strip().replace('\\n',' ')[:500])
          for p in ['/etc/os-release','/etc/resolv.conf']:
              q=Path(p)
              if q.exists():
                  text=q.read_text(encoding='utf-8',errors='replace')
                  safe=[]
                  for line in text.splitlines():
                      line=line.strip()
                      if p.endswith('os-release') or line.startswith(('nameserver ','options ','search ')):
                          safe.append(line)
                  print('C3_PROBE_FILE',p,safe[:30])
          print('C3_PROBE_DONE')
          '''.replace('\n          ','\n').lstrip(), encoding='utf-8')
          meta={
              'id':kernel,
              'title':'C3 Cori Network Env Probe',
              'code_file':'probe.py',
              'language':'python',
              'kernel_type':'script',
              'is_private':True,
              'enable_gpu':False,
              'enable_internet':True,
              'dataset_sources':[],
              'competition_sources':[],
              'kernel_sources':[],
              'model_sources':[],
          }
          Path('probe/kernel-metadata.json').write_text(json.dumps(meta,indent=2)+'\n',encoding='utf-8')
          Path('kernel-id.txt').write_text(kernel+'\n',encoding='utf-8')
          print('C3_CPU_PROBE_BUILD_PASS')
          PY
      - name: Push CPU-only Kaggle kernel
        run: kaggle kernels push -p probe -t 600
      - name: Wait and collect sanitized diagnostics
        shell: bash
        run: |
          set -u
          K=$(cat kernel-id.txt)
          STATUS=UNKNOWN
          for i in $(seq 1 60); do
            O=$(kaggle kernels status "$K" 2>&1 || true)
            echo "C3_CPU_PROBE_STATUS ${O##*status }"
            if echo "$O" | grep -q 'KernelWorkerStatus.COMPLETE'; then STATUS=COMPLETE; break; fi
            if echo "$O" | grep -Eq 'KernelWorkerStatus\.(ERROR|FAILED|CANCELLED|CANCELED)'; then STATUS=ERROR; break; fi
            sleep 10
          done
          rm -rf probe_out; mkdir probe_out
          kaggle kernels output "$K" -p probe_out --force || true
          PROBE_STATUS="$STATUS" python - <<'PY'
          from pathlib import Path
          import json, os
          out=[]
          for p in Path('probe_out').rglob('*.log'):
              text=p.read_text(encoding='utf-8',errors='replace')
              try: rows=json.loads(text)
              except Exception: rows=None
              if isinstance(rows,list):
                  for row in rows:
                      for line in str(row.get('data','')).splitlines():
                          if line.startswith('C3_PROBE_'): out.append(line)
              else:
                  for line in text.splitlines():
                      if 'C3_PROBE_' in line: out.append(line.strip())
          body=['# Kaggle API CPU network/environment probe','', 'Sanitized operational output; no credentials or private model/audio data.','', 'terminal_status: '+os.environ.get('PROBE_STATUS','UNKNOWN'),'','```text',*out,'```','']
          Path('ops/kaggle-network-probe-latest.txt').write_text('\n'.join(body)+'\n',encoding='utf-8')
          print('\n'.join(out))
          PY
      - name: Persist sanitized result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ops/kaggle-network-probe-latest.txt || printf '# Kaggle API CPU network/environment probe\n\nterminal_status: WORKFLOW_FAILED_BEFORE_REPORT\n' > ops/kaggle-network-probe-latest.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/kaggle-network-probe-latest.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Kaggle CPU environment probe'
          git push
      - name: Cleanup
        if: always()
        run: rm -rf probe probe_out kernel-id.txt
