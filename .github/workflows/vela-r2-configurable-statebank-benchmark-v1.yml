name: VELA R2 configurable state-bank benchmark v1

on:
  push:
    branches: [exp/vela-r2-configurable-statebank-benchmark-v1]
    paths:
      - '.github/workflows/vela-r2-configurable-statebank-benchmark-v1.yml'
      - 'experiments/vela-active-state/r2-configurable-statebank-benchmark-v1/**'
  workflow_dispatch:
    inputs:
      model_profile_id:
        description: Select exactly one model for this run
        required: true
        type: choice
        options:
          - rwkv7-g1i-2.9b-20260805
          - rwkv7-g1i-7.2b-20260805
        default: rwkv7-g1i-2.9b-20260805
      problem_pack:
        description: Repository-relative problem-pack file or directory
        required: true
        type: string
        default: experiments/vela-active-state/r2-configurable-statebank-benchmark-v1/problem_packs/VELA_R2_StateBank_ProblemPack_v1/PROBLEM_SOURCE_V1.json
      execution_config:
        description: Repository-relative routing/state/retrieval config
        required: true
        type: string
        default: experiments/vela-active-state/r2-configurable-statebank-benchmark-v1/EXECUTION_CONFIG_V1.json
      retrieval_mode:
        description: Retrieval mode declared by the execution config
        required: true
        type: string
        default: OFF
      execute_paid:
        description: Execute the separately authorized one-pod RunPod run
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vela-r2-configurable-statebank-${{ github.ref }}-${{ inputs.model_profile_id || 'contract' }}
  cancel-in-progress: false

env:
  EXPERIMENT_DIR: experiments/vela-active-state/r2-configurable-statebank-benchmark-v1
  BASE_HEAD: 8cd35b00660d0123c6a63606507aaf14fa00522e
  DEFAULT_PACK: experiments/vela-active-state/r2-configurable-statebank-benchmark-v1/problem_packs/VELA_R2_StateBank_ProblemPack_v1/PROBLEM_SOURCE_V1.json
  DEFAULT_CONFIG: experiments/vela-active-state/r2-configurable-statebank-benchmark-v1/EXECUTION_CONFIG_V1.json

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact mutation scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_HEAD" "$GITHUB_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_HEAD" "$GITHUB_SHA" | sort)
          for p in "${changed[@]}"; do
            case "$p" in
              '.github/workflows/vela-r2-configurable-statebank-benchmark-v1.yml'|experiments/vela-active-state/r2-configurable-statebank-benchmark-v1/*) ;;
              *) echo "::error::unexpected path $p"; exit 1;;
            esac
          done
      - name: Validate data-driven benchmark contract
        run: |
          set -euo pipefail
          python "$EXPERIMENT_DIR/validate_benchmark_v1.py" \
            --execution-config "$DEFAULT_CONFIG" \
            --problem-pack "$DEFAULT_PACK" \
            --workflow .github/workflows/vela-r2-configurable-statebank-benchmark-v1.yml
          python -m py_compile \
            "$EXPERIMENT_DIR/benchmark_contract.py" \
            "$EXPERIMENT_DIR/benchmark_metrics.py" \
            "$EXPERIMENT_DIR/rwkv_state_engine.py" \
            "$EXPERIMENT_DIR/statebank_runner.py" \
            "$EXPERIMENT_DIR/runpod_statebank_supervisor_v1.py" \
            "$EXPERIMENT_DIR/runpod_statebank_launch_v1.py"
      - name: Validate both selectable models independently without loading weights
        run: |
          set -euo pipefail
          for model in rwkv7-g1i-2.9b-20260805 rwkv7-g1i-7.2b-20260805; do
            python "$EXPERIMENT_DIR/statebank_runner.py" \
              --execution-config "$DEFAULT_CONFIG" \
              --problem-pack "$DEFAULT_PACK" \
              --model-profile "$model" \
              --retrieval-mode OFF \
              --validate-only
          done
      - name: Prove one-model provider-free launch plans
        run: |
          set -euo pipefail
          for model in rwkv7-g1i-2.9b-20260805 rwkv7-g1i-7.2b-20260805; do
            VELA_SOURCE_COMMIT="$GITHUB_SHA" \
            VELA_MODEL_PROFILE_ID="$model" \
            VELA_RETRIEVAL_MODE=OFF \
            VELA_PROBLEM_PACK_REL="$DEFAULT_PACK" \
            VELA_EXECUTION_CONFIG_REL="$DEFAULT_CONFIG" \
            python "$EXPERIMENT_DIR/runpod_statebank_launch_v1.py" --dry-run
          done
      - name: Verify paid authority is fail-closed
        run: |
          python - <<'PY'
          import json
          a=json.load(open('experiments/vela-active-state/r2-configurable-statebank-benchmark-v1/RUNPOD_SINGLE_RUN_AUTH_V1.json'))
          assert a['status'] in {'PREPARED_UNARMED','AUTHORIZED_SINGLE_RUN','CONSUMED_SUCCESS'}
          assert a['maxPodCount']==1 and float(a['maxTotalUsd'])<=0.13 and a['maxRuntimeSeconds']==900
          assert a['automaticRetry'] is False and a['fallbackProviders']==[]
          assert set(a['allowedModelProfiles'])=={'rwkv7-g1i-2.9b-20260805','rwkv7-g1i-7.2b-20260805'}
          if a['status']=='PREPARED_UNARMED':
              assert a['paidExecutionAuthorized'] is False and a['boundRun'] is None
          PY

  readiness:
    needs: contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_paid }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read provider state only
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}"
          bash "$EXPERIMENT_DIR/install_runpodctl_pinned_v1.sh" /tmp/runpodctl
          sudo install -m 0755 /tmp/runpodctl /usr/local/bin/runpodctl
          runpodctl user >/dev/null
          runpodctl gpu list --include-unavailable > /tmp/gpu-list.json
          python "$EXPERIMENT_DIR/runpod_select_a40_capacity_v1.py" /tmp/gpu-list.json /tmp/selection.json

  auth-gate:
    needs: [contract, readiness]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_paid }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MODEL_PROFILE_ID: ${{ inputs.model_profile_id }}
      PROBLEM_PACK: ${{ inputs.problem_pack }}
      EXECUTION_CONFIG: ${{ inputs.execution_config }}
      RETRIEVAL_MODE: ${{ inputs.retrieval_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact one-shot authorization
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          a=json.load(open('experiments/vela-active-state/r2-configurable-statebank-benchmark-v1/RUNPOD_SINGLE_RUN_AUTH_V1.json'))
          assert a['status']=='AUTHORIZED_SINGLE_RUN' and a['paidExecutionAuthorized'] is True
          assert a['maxPodCount']==1 and float(a['maxTotalUsd'])<=0.13 and a['maxRuntimeSeconds']==900
          assert a['automaticRetry'] is False and a['fallbackProviders']==[]
          assert os.environ['MODEL_PROFILE_ID'] in a['allowedModelProfiles']
          b=a['boundRun']; assert isinstance(b,dict)
          assert b['sourceCommit']==os.environ['GITHUB_SHA']
          assert b['modelProfileId']==os.environ['MODEL_PROFILE_ID']
          assert b['problemPackPath']==os.environ['PROBLEM_PACK']
          assert b['executionConfigPath']==os.environ['EXECUTION_CONFIG']
          assert b['retrievalMode']==os.environ['RETRIEVAL_MODE']
          assert b['problemPackSha256']==hashlib.sha256(Path(os.environ['PROBLEM_PACK']).read_bytes()).hexdigest()
          assert b['executionConfigSha256']==hashlib.sha256(Path(os.environ['EXECUTION_CONFIG']).read_bytes()).hexdigest()
          PY

  science:
    needs: [readiness, auth-gate]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_paid && needs.auth-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      VELA_SOURCE_COMMIT: ${{ github.sha }}
      VELA_MODEL_PROFILE_ID: ${{ inputs.model_profile_id }}
      VELA_RETRIEVAL_MODE: ${{ inputs.retrieval_mode }}
      VELA_PROBLEM_PACK_REL: ${{ inputs.problem_pack }}
      VELA_EXECUTION_CONFIG_REL: ${{ inputs.execution_config }}
      VELA_PAID_EXECUTION_AUTHORIZED: 'true'
      VELA_MAX_RUNTIME_SECONDS: '900'
      VELA_EVIDENCE_DIR: /tmp/vela-statebank
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install exact pinned RunPod CLI
        run: |
          bash "$EXPERIMENT_DIR/install_runpodctl_pinned_v1.sh" /tmp/runpodctl
          sudo install -m 0755 /tmp/runpodctl /usr/local/bin/runpodctl
      - name: Execute exactly one selected model
        run: python "$EXPERIMENT_DIR/runpod_statebank_launch_v1.py"
      - name: Validate result identity and cleanup
        run: |
          python - <<'PY'
          import json,os
          r=json.load(open('/tmp/vela-statebank/benchmark_result.json'))
          e=json.load(open('/tmp/vela-statebank/provider-envelope.json'))
          assert r['schema']=='vela-statebank-benchmark-result:v1' and r['status']=='COMPLETE'
          assert r['source_commit']==os.environ['GITHUB_SHA']
          assert r['model_profile']['id']==os.environ['VELA_MODEL_PROFILE_ID']
          assert r['retrieval_mode']==os.environ['VELA_RETRIEVAL_MODE']
          assert e['status']=='PASS' and e['pod_deleted'] is True
          assert e['max_pod_count']==1 and e['model_selection_cardinality']==1
          assert e['estimated_gpu_cost_upper_bound_usd']<=0.13
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vela-statebank-${{ inputs.model_profile_id }}-${{ inputs.retrieval_mode }}
          path: /tmp/vela-statebank
          if-no-files-found: warn
          retention-days: 30
