name: Dashboard Main One-shot Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dashboard-main-once.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: 80bc1025a40eb3ebb444b4686d493f65ac3d2761
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner-repo
          fetch-depth: 0
      - id: checkout
        uses: actions/checkout@v4
        with:
          repository: jeonghun917/dashboard-control-center
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          path: dashboard
          fetch-depth: 1
          persist-credentials: false
      - id: identity
        working-directory: dashboard
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "actual_sha=$actual" >> "$GITHUB_OUTPUT"
          test "$actual" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - id: npm_ci
        working-directory: dashboard
        run: npm ci
      - id: npm_check
        working-directory: dashboard
        run: npm run check
      - if: always()
        working-directory: runner-repo
        shell: bash
        env:
          ACTUAL_SHA: ${{ steps.identity.outputs.actual_sha }}
          CHECKOUT_STATUS: ${{ steps.checkout.outcome }}
          IDENTITY_STATUS: ${{ steps.identity.outcome }}
          NPM_CI_STATUS: ${{ steps.npm_ci.outcome }}
          NPM_CHECK_STATUS: ${{ steps.npm_check.outcome }}
        run: |
          set -euo pipefail
          mkdir -p ops
          python - <<'PY'
          import json, os
          data = {
            "targetSha": os.environ["TARGET_SHA"],
            "actualSha": os.environ.get("ACTUAL_SHA", ""),
            "privateCheckout": os.environ.get("CHECKOUT_STATUS", ""),
            "identityCheck": os.environ.get("IDENTITY_STATUS", ""),
            "npmCi": os.environ.get("NPM_CI_STATUS", ""),
            "npmRunCheck": os.environ.get("NPM_CHECK_STATUS", ""),
            "runId": os.environ.get("GITHUB_RUN_ID", "")
          }
          with open("ops/dashboard-main-validation.json", "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add ops/dashboard-main-validation.json
          if ! git diff --cached --quiet; then
            git commit -m "Record merged dashboard main validation"
            git push origin HEAD:main
          fi
