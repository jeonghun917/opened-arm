name: Cori Kaggle T4 Benchmark Launch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cori-kaggle-t4-run.yml'
      - 'runner/kaggle_cori_kernel.py'
      - 'runner/kaggle_cori_segment_entry.py'
      - 'runner/lightning_cori_continue_to550.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m py_compile \
            runner/kaggle_cori_kernel.py \
            runner/kaggle_cori_segment_entry.py \
            runner/lightning_cori_continue_to550.py

  launch-private-t4-benchmark:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_DATASET_ID: ${{ secrets.KAGGLE_DATASET_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Kaggle auth and private dataset handle
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_DATASET_ID:-}" || { echo 'missing KAGGLE_DATASET_ID'; exit 2; }
          [[ "$KAGGLE_DATASET_ID" == */* ]] || { echo 'KAGGLE_DATASET_ID must be owner/private-dataset-slug'; exit 2; }
          if [ -z "${KAGGLE_API_TOKEN:-}" ] && { [ -z "${KAGGLE_USERNAME:-}" ] || [ -z "${KAGGLE_KEY:-}" ]; }; then
            echo 'missing Kaggle auth: add KAGGLE_API_TOKEN or KAGGLE_USERNAME + KAGGLE_KEY'
            exit 2
          fi

      - name: Install Kaggle CLI
        run: python -m pip install --quiet --upgrade kaggle

      - name: Verify private dataset exists
        run: |
          set -euo pipefail
          kaggle datasets status "$KAGGLE_DATASET_ID" >/dev/null
          echo C3_KAGGLE_PRIVATE_DATASET_STATUS_PASS

      - name: Build private kernel bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kaggle_kernel_bundle
          mkdir -p kaggle_kernel_bundle
          cp runner/kaggle_cori_kernel.py kaggle_kernel_bundle/benchmark.py
          cp runner/kaggle_cori_segment_entry.py kaggle_kernel_bundle/kaggle_cori_segment_entry.py
          cp runner/lightning_cori_continue_to550.py kaggle_kernel_bundle/lightning_cori_continue_to550.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          dataset_id=os.environ['KAGGLE_DATASET_ID'].strip()
          owner, _ = dataset_id.split('/',1)
          metadata={
              'id': f'{owner}/c3-cori-e280-e290-t4-benchmark',
              'title': 'C3 Cori E280 E290 T4 Benchmark',
              'code_file': 'benchmark.py',
              'language': 'python',
              'kernel_type': 'script',
              'is_private': True,
              'enable_gpu': True,
              'enable_internet': True,
              'machine_shape': 'NvidiaTeslaT4',
              'dataset_sources': [dataset_id],
              'competition_sources': [],
              'kernel_sources': [],
              'model_sources': [],
          }
          Path('kaggle_kernel_bundle/kernel-metadata.json').write_text(
              json.dumps(metadata, indent=2)+'\n', encoding='utf-8'
          )
          print('C3_KAGGLE_KERNEL_ID='+metadata['id'])
          PY

      - name: Push and start private T4 kernel
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle_kernel_bundle --accelerator NvidiaTeslaT4 -t 43200
          echo C3_KAGGLE_T4_KERNEL_PUSHED

      - name: Remove local kernel bundle
        if: always()
        run: rm -rf kaggle_kernel_bundle
