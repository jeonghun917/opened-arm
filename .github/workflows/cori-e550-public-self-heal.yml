name: Opened ARM Cori Emergency Halt

# Emergency stop mode: recurring training is intentionally disabled.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cori-e550-public-self-heal.yml"

concurrency:
  group: opened-arm-cori-e550
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  halt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
      LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
    steps:
      - name: Credential gate
        id: gate
        shell: bash
        run: |
          if [ -n "${LIGHTNING_USER_ID:-}" ] && [ -n "${LIGHTNING_API_KEY:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Lightning credential gate: missing secret(s); cannot issue stop"
          fi

      - name: Set up Python
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lightning SDK
        if: steps.gate.outputs.ready == 'true'
        run: python -m pip install --upgrade lightning-sdk

      - name: Stop current Cori paid job
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from lightning_sdk import Job

          ORG = "jeonghun917-org"
          TEAMSPACE = "default-project"
          JOB_NAME = "c3-cori-e280-e290-b16-oa019"

          job = Job(JOB_NAME, teamspace=TEAMSPACE, org=ORG)
          status = str(job.status).lower()
          print("CORI_EMERGENCY_HALT current_status=", status, flush=True)
          if status in {"pending", "running"}:
              job.stop()
              print("CORI_EMERGENCY_HALT stop_requested", JOB_NAME, flush=True)
          else:
              print("CORI_EMERGENCY_HALT no_active_job", JOB_NAME, status, flush=True)
          PY

      - name: Halt confirmation
        run: |
          echo "Recurring Cori self-heal is disabled. This workflow no longer has a schedule and never launches a training segment."
