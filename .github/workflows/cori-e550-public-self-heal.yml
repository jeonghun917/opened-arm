name: Opened ARM Cori E550 Self Heal

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cori-e550-public-self-heal.yml"
      - "ops/cori_self_healer_to550.py"
      - "ops/cori-selfheal-state.json"
      - "runner/lightning_cori_continue_to550.py"
      - "runner/lightning_cori_segment_entry.py"

concurrency:
  group: opened-arm-cori-e550
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
      LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Credential gate
        id: gate
        shell: bash
        run: |
          if [ -n "${LIGHTNING_USER_ID:-}" ] && [ -n "${LIGHTNING_API_KEY:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Lightning credential gate: ready"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Lightning credential gate: missing secret(s); successful no-op"
          fi

      - name: Set up Python
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        if: steps.gate.outputs.ready == 'true'
        run: python -m py_compile ops/cori_self_healer_to550.py runner/lightning_cori_continue_to550.py runner/lightning_cori_segment_entry.py

      - name: Install Lightning SDK
        if: steps.gate.outputs.ready == 'true'
        run: python -m pip install --upgrade lightning-sdk

      - name: Continue Cori to E550
        if: steps.gate.outputs.ready == 'true'
        run: python ops/cori_self_healer_to550.py

      - name: Persist controller state
        if: always() && steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f ops/cori-selfheal-state.json || exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/cori-selfheal-state.json
          if git diff --cached --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "Update Cori E550 continuation state"
          git push origin HEAD:main
