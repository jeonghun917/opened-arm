name: Dashboard Status One-shot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dashboard-status-once.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: 80bc1025a40eb3ebb444b4686d493f65ac3d2761
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner-repo
          fetch-depth: 0

      - name: Check credential
        id: credential
        shell: bash
        env:
          DASHBOARD_REPO_TOKEN: ${{ secrets.DASHBOARD_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${DASHBOARD_REPO_TOKEN:-}"

      - name: Publish pending status
        id: pending_status
        continue-on-error: true
        shell: bash
        env:
          DASHBOARD_REPO_TOKEN: ${{ secrets.DASHBOARD_REPO_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${DASHBOARD_REPO_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/jeonghun917/dashboard-control-center/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"dashboard-public-validation\",\"description\":\"Public exact-SHA validation started\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null

      - name: Checkout exact dashboard SHA
        id: checkout
        uses: actions/checkout@v4
        with:
          repository: jeonghun917/dashboard-control-center
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          path: dashboard
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        id: identity
        shell: bash
        working-directory: dashboard
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "actual_sha=$actual" >> "$GITHUB_OUTPUT"
          test "$actual" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: npm ci
        id: npm_ci
        working-directory: dashboard
        run: npm ci

      - name: npm run check
        id: npm_check
        working-directory: dashboard
        run: npm run check

      - name: Publish final status
        id: final_status
        if: always()
        continue-on-error: true
        shell: bash
        env:
          DASHBOARD_REPO_TOKEN: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          CREDENTIAL_STATUS: ${{ steps.credential.outcome }}
          CHECKOUT_STATUS: ${{ steps.checkout.outcome }}
          IDENTITY_STATUS: ${{ steps.identity.outcome }}
          NPM_CI_STATUS: ${{ steps.npm_ci.outcome }}
          NPM_CHECK_STATUS: ${{ steps.npm_check.outcome }}
        run: |
          set -euo pipefail
          state=failure
          description="Public exact-SHA validation failed"
          if [ "$CREDENTIAL_STATUS" = success ] && [ "$CHECKOUT_STATUS" = success ] && [ "$IDENTITY_STATUS" = success ] && [ "$NPM_CI_STATUS" = success ] && [ "$NPM_CHECK_STATUS" = success ]; then
            state=success
            description="npm ci + npm run check passed"
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${DASHBOARD_REPO_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/jeonghun917/dashboard-control-center/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"${state}\",\"context\":\"dashboard-public-validation\",\"description\":\"${description}\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null

      - name: Persist evidence
        if: always()
        working-directory: runner-repo
        shell: bash
        env:
          ACTUAL_SHA: ${{ steps.identity.outputs.actual_sha }}
          CREDENTIAL_STATUS: ${{ steps.credential.outcome }}
          PENDING_STATUS: ${{ steps.pending_status.outcome }}
          CHECKOUT_STATUS: ${{ steps.checkout.outcome }}
          IDENTITY_STATUS: ${{ steps.identity.outcome }}
          NPM_CI_STATUS: ${{ steps.npm_ci.outcome }}
          NPM_CHECK_STATUS: ${{ steps.npm_check.outcome }}
          FINAL_STATUS: ${{ steps.final_status.outcome }}
        run: |
          set -euo pipefail
          mkdir -p ops
          python - <<'PY'
          import json, os
          data = {
            "targetSha": os.environ["TARGET_SHA"],
            "actualSha": os.environ.get("ACTUAL_SHA", ""),
            "credentialGate": os.environ.get("CREDENTIAL_STATUS", ""),
            "pendingStatusPublish": os.environ.get("PENDING_STATUS", ""),
            "privateCheckout": os.environ.get("CHECKOUT_STATUS", ""),
            "identityCheck": os.environ.get("IDENTITY_STATUS", ""),
            "npmCi": os.environ.get("NPM_CI_STATUS", ""),
            "npmRunCheck": os.environ.get("NPM_CHECK_STATUS", ""),
            "finalStatusPublish": os.environ.get("FINAL_STATUS", ""),
            "runId": os.environ.get("GITHUB_RUN_ID", "")
          }
          with open("ops/dashboard-status-once.json", "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add ops/dashboard-status-once.json
          if ! git diff --cached --quiet; then
            git commit -m "Record dashboard status permission validation"
            git push origin HEAD:main
          fi

      - name: Require status publication
        if: always()
        shell: bash
        env:
          PENDING_STATUS: ${{ steps.pending_status.outcome }}
          FINAL_STATUS: ${{ steps.final_status.outcome }}
        run: |
          set -euo pipefail
          test "$PENDING_STATUS" = success
          test "$FINAL_STATUS" = success
