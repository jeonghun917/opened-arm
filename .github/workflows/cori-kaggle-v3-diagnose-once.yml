name: Cori Kaggle V3 Diagnose Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cori-kaggle-v3-diagnose-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/kaggle-p100-port'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_DATASET_ID: ${{ secrets.KAGGLE_DATASET_ID }}
      FAILED_KERNEL_ID: jeonghunmun/c3-cori-e280-e290-t4-benchmark
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: python -m pip install --quiet --upgrade kaggle
      - name: Pull latest failed-kernel log
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels status "$FAILED_KERNEL_ID" || true
          rm -rf failed_out; mkdir failed_out
          kaggle kernels output "$FAILED_KERNEL_ID" -p failed_out --force || true
          python - <<'PY'
          from pathlib import Path
          import json
          for p in Path('failed_out').rglob('*.log'):
              try: rows=json.loads(p.read_text(encoding='utf-8',errors='replace'))
              except Exception: continue
              for r in rows:
                  d=str(r.get('data',''))
                  if any(k in d for k in ('Traceback','RuntimeError','C3_KAGGLE_')):
                      print('C3_FAILED_LOG',d.replace('\n',' | ')[:2500])
          PY
      - name: Build private CPU mount probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf probe
          mkdir probe
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path
          token=os.environ['KAGGLE_API_TOKEN']
          configured=os.environ['KAGGLE_DATASET_ID'].strip()
          _,slug=configured.split('/',1)
          req=urllib.request.Request('https://www.kaggle.com/api/v1/oauth2/introspect',data=urllib.parse.urlencode({'token':token}).encode(),headers={'Content-Type':'application/x-www-form-urlencoded'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          owner=(data.get('username') or '').strip()
          if not data.get('active') or not owner: raise SystemExit('inactive Kaggle token')
          dataset=f'{owner}/{slug}'
          kernel=f'{owner}/c3-cori-input-mount-probe'
          code=r'''import os
from pathlib import Path
root=Path('/kaggle/input')
print('C3_PROBE_ROOT',root.exists(),root.is_symlink())
try:
    print('C3_PROBE_TOP',[(p.name,p.is_dir(),p.is_symlink(),str(p.resolve())[:500]) for p in root.iterdir()])
except Exception as e: print('C3_PROBE_TOP_ERROR',type(e).__name__,str(e))
seen=0
for base,dirs,files in os.walk(str(root),followlinks=True):
    rel=os.path.relpath(base,str(root))
    print('C3_PROBE_DIR',rel,'ISLINK',os.path.islink(base),'DIRS',dirs[:30],'FILES',files[:60])
    seen+=1
    if seen>=120:
        print('C3_PROBE_TRUNCATED'); break
print('C3_PROBE_DONE',seen)
'''
          Path('probe/probe.py').write_text(code,encoding='utf-8')
          meta={'id':kernel,'title':'C3 Cori Input Mount Probe','code_file':'probe.py','language':'python','kernel_type':'script','is_private':True,'enable_gpu':False,'enable_internet':False,'dataset_sources':[dataset],'competition_sources':[],'kernel_sources':[],'model_sources':[]}
          Path('probe/kernel-metadata.json').write_text(json.dumps(meta,indent=2)+'\n',encoding='utf-8')
          Path('probe-id.txt').write_text(kernel+'\n',encoding='utf-8')
          print('C3_PROBE_EFFECTIVE_DATASET',dataset)
          PY
      - name: Run CPU mount probe and print sanitized tree
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p probe -t 600
          K=$(cat probe-id.txt)
          for i in $(seq 1 60); do
            O=$(kaggle kernels status "$K" 2>&1 || true)
            echo "C3_PROBE_STATUS ${O##*status }"
            if echo "$O" | grep -Eq 'KernelWorkerStatus\.(COMPLETE|ERROR|FAILED|CANCELLED|CANCELED)'; then break; fi
            sleep 10
          done
          rm -rf probe_out; mkdir probe_out
          kaggle kernels output "$K" -p probe_out --force || true
          python - <<'PY'
          from pathlib import Path
          import json
          for p in Path('probe_out').rglob('*.log'):
              try: rows=json.loads(p.read_text(encoding='utf-8',errors='replace'))
              except Exception: continue
              for r in rows:
                  d=str(r.get('data',''))
                  if 'C3_PROBE_' in d or 'Traceback' in d or 'RuntimeError' in d:
                      print(d.replace('\n',' | ')[:5000])
          PY
      - name: Cleanup
        if: always()
        run: rm -rf failed_out probe probe_out probe-id.txt
