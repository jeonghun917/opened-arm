name: VELA experiment smoke

on:
  push:
    branches: [vela-experiment-infra]
    paths:
      - 'experiments/vela-active-state/microbudget-v1/**'
      - '.github/workflows/vela-experiment-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vela-experiment-infra
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile experiment Python
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          root = Path('experiments/vela-active-state/microbudget-v1')
          for p in root.rglob('*.py'):
              py_compile.compile(str(p), doraise=True)
          print('compile PASS')
          PY
      - name: Single-subject HARD GATE smoke
        run: python experiments/vela-active-state/microbudget-v1/shared/hard_gate_smoke.py
      - name: Budget ceiling smoke
        run: |
          cd experiments/vela-active-state/microbudget-v1
          mkdir -p runs
          printf '{"lightning":0.0,"modal":0.0,"events":[]}' > runs/paid_budget_ledger.json
          python shared/budget_guard.py lightning 4.5
          if python shared/budget_guard.py lightning 4.5001; then
            echo 'budget guard failed to block provider ceiling'
            exit 1
          fi
          printf '{"lightning":3.5,"modal":3.5,"events":[]}' > runs/paid_budget_ledger.json
          if python shared/budget_guard.py modal 0.01; then
            echo 'budget guard failed to block total ceiling'
            exit 1
          fi
          echo 'budget guard PASS'

  rwkv-cpu-state-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vela-experiment-infra
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.2,<3' 'transformers>=4.40,<5'
      - name: Run real RWKV recurrent-state checkpoint smoke on CPU
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          VELA_RESULT_PATH: ops/vela-results/rwkv-cpu-latest.json
        run: |
          python experiments/vela-active-state/microbudget-v1/shared/rwkv_state_restore.py
      - name: Commit RWKV result snapshot
        if: always()
        run: |
          if [[ ! -f ops/vela-results/rwkv-cpu-latest.json ]]; then
            mkdir -p ops/vela-results
            printf '{"status":"FAIL_BEFORE_RESULT","source_commit":"%s"}\n' "$GITHUB_SHA" > ops/vela-results/rwkv-cpu-latest.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/vela-results/rwkv-cpu-latest.json
          git diff --cached --quiet || git commit -m 'Record VELA RWKV CPU state result [skip ci]'
          git push origin HEAD:vela-experiment-infra
