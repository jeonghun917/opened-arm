name: Cori Kaggle Offline Runtime Build and CPU Validate

on:
  push:
    branches: [main]
    paths:
      - 'ops/kaggle-offline-runtime-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_DATASET_ID: ${{ secrets.KAGGLE_DATASET_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build clients
        run: python -m pip install --quiet --upgrade pip wheel kaggle
      - name: Build, publish and CPU-validate offline runtime
        id: build
        shell: bash
        run: |
          set +e
          python ops/build_kaggle_offline_runtime.py
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist bounded CPU validation report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ops/kaggle-offline-runtime-validation-latest.txt ]; then
            printf '# Kaggle offline runtime CPU validation\n\nterminal_status: BUILDER_FAILED_BEFORE_VALIDATION_REPORT\nvalidation_pass: false\n' > ops/kaggle-offline-runtime-validation-latest.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add ops/kaggle-offline-runtime-validation-latest.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record Kaggle offline runtime CPU validation'
            git push origin HEAD:main
          fi
      - name: Enforce validation gate
        if: always()
        shell: bash
        run: |
          test "${{ steps.build.outputs.rc }}" = "0"
      - name: Cleanup
        if: always()
        run: rm -rf .c3-kaggle-offline-build
