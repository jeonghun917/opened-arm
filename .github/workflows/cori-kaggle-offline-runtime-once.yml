name: Cori Kaggle Offline Runtime Build and CPU Validate

on:
  push:
    branches: [main]
    paths:
      - 'ops/kaggle-offline-runtime-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_DATASET_ID: ${{ secrets.KAGGLE_DATASET_ID }}
      MATCHA_COMMIT: bd4d90d93214b37f7a159cf205ae85762c2c10aa
      E280_SHA256: 081cf4012a4087f437b8bf2fa0a115da931c5aff26fe22a67acb4f25707cb7a9
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate auth inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo 'missing KAGGLE_API_TOKEN'; exit 2; }
          [[ "${KAGGLE_DATASET_ID:-}" == */* ]] || { echo 'invalid KAGGLE_DATASET_ID'; exit 2; }
      - name: Install build clients
        run: python -m pip install --quiet --upgrade pip wheel kaggle
      - name: Resolve Kaggle owner
        id: ident
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token=os.environ['KAGGLE_API_TOKEN']
          req=urllib.request.Request('https://www.kaggle.com/api/v1/oauth2/introspect',data=urllib.parse.urlencode({'token':token}).encode(),headers={'Content-Type':'application/x-www-form-urlencoded'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          owner=(data.get('username') or '').strip()
          if not data.get('active') or not owner: raise SystemExit('inactive Kaggle token')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('owner='+owner+'\n')
              f.write('runtime_id='+owner+'/c3-cori-offline-runtime\n')
              f.write('kernel_id='+owner+'/c3-cori-offline-runtime-cpu-validate\n')
          print('C3_OFFLINE_OWNER_RESOLVED')
          PY
      - name: Build public-source offline runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runtime-build runtime-upload Matcha-TTS
          mkdir -p runtime-build/wheelhouse runtime-build/debs runtime-upload
          git clone --quiet https://github.com/shivammehta25/Matcha-TTS.git Matcha-TTS
          git -C Matcha-TTS checkout --quiet --detach "$MATCHA_COMMIT"
          test "$(git -C Matcha-TTS rev-parse HEAD)" = "$MATCHA_COMMIT"
          git -C Matcha-TTS archive --format=tar.gz -o ../runtime-build/matcha-source.tar.gz "$MATCHA_COMMIT"

          # Small/core Python packages only. Torch/NumPy/SciPy are intentionally not
          # vendored: the Kaggle image supplies its CUDA-matched scientific stack.
          packages=(
            'lightning==2.6.5'
            'lightning-utilities'
            'torchmetrics'
            'hydra-core==1.3.2'
            'hydra-colorlog==1.2.0'
            'omegaconf==2.3.0'
            'antlr4-python3-runtime==4.9.3'
            'phonemizer==3.3.0'
            'segments'
            'dlinfo'
            'joblib'
            'attrs'
            'rootutils'
            'rich'
            'einops'
            'inflect'
            'more-itertools'
            'typeguard'
            'Unidecode'
            'conformer==0.3.2'
            'diffusers'
            'huggingface-hub'
            'safetensors'
            'Cython'
            'packaging'
          )
          for pkg in "${packages[@]}"; do
            python -m pip wheel --quiet --wheel-dir runtime-build/wheelhouse --no-deps "$pkg"
          done

          sudo apt-get update -qq
          cd runtime-build/debs
          apt-get download espeak-ng espeak-ng-data libespeak-ng1 libpcaudio0 libsonic0 >/dev/null
          cd ../..

          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, platform
          root=Path('runtime-build')
          rows=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file(): continue
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              rows.append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':h})
          manifest={
              'schema':'c3-kaggle-offline-runtime-v1',
              'matcha_commit':os.environ['MATCHA_COMMIT'],
              'builder_python':platform.python_version(),
              'builder_platform':platform.platform(),
              'network_required_at_kaggle_runtime':False,
              'torch_vendored':False,
              'files':rows,
          }
          (root/'runtime-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          PY
          tar -C runtime-build -czf runtime-upload/c3-cori-offline-runtime.tar.gz .
          sha256sum runtime-upload/c3-cori-offline-runtime.tar.gz > runtime-upload/archive.sha256
      - name: Publish private runtime Dataset
        env:
          RUNTIME_ID: ${{ steps.ident.outputs.runtime_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          meta={
              'title':'C3 Cori Offline Runtime',
              'id':os.environ['RUNTIME_ID'],
              'licenses':[{'name':'other'}],
              'description':'Private operational cache of public/open-source runtime dependencies for network-free C3 Cori Kaggle execution.'
          }
          Path('runtime-upload/dataset-metadata.json').write_text(json.dumps(meta,indent=2)+'\n',encoding='utf-8')
          PY
          if kaggle datasets status "$RUNTIME_ID" >/dev/null 2>&1; then
            kaggle datasets version -p runtime-upload -m 'Refresh offline runtime bundle' -q -t
          else
            kaggle datasets create -p runtime-upload -q -t
          fi
          kaggle datasets status "$RUNTIME_ID"
          echo C3_OFFLINE_RUNTIME_PUBLISH_PASS
      - name: Build CPU-only offline validation kernel
        env:
          RUNTIME_ID: ${{ steps.ident.outputs.runtime_id }}
          KERNEL_ID: ${{ steps.ident.outputs.kernel_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf offline-validate
          mkdir offline-validate
          python - <<'PY'
          import json, os, textwrap
          from pathlib import Path
          script=textwrap.dedent(r'''
          from __future__ import annotations
          import hashlib
          import importlib.metadata as md
          import json
          import os
          import shutil
          import subprocess
          import sys
          import tarfile
          from pathlib import Path

          INPUT=Path('/kaggle/input')
          WORK=Path('/kaggle/working/c3-offline-validation')
          WORK.mkdir(parents=True,exist_ok=True)
          E280_SHA='081cf4012a4087f437b8bf2fa0a115da931c5aff26fe22a67acb4f25707cb7a9'
          MATCHA_COMMIT='bd4d90d93214b37f7a159cf205ae85762c2c10aa'

          def sha256(p:Path)->str:
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              return h.hexdigest()

          def run(cmd,cwd=None,env=None):
              print('C3_OFFLINE_CMD',' '.join(map(str,cmd)),flush=True)
              subprocess.run(list(map(str,cmd)),cwd=str(cwd) if cwd else None,env=env,check=True)

          archives=list(INPUT.rglob('c3-cori-offline-runtime.tar.gz'))
          manifests=list(INPUT.rglob('runtime-manifest.json'))
          runtime=WORK/'runtime'
          if len(archives)==1:
              if runtime.exists(): shutil.rmtree(runtime)
              runtime.mkdir()
              with tarfile.open(archives[0],'r:gz') as tf: tf.extractall(runtime)
          elif len(manifests)==1:
              runtime=manifests[0].parent
          else:
              raise RuntimeError(f'offline runtime discovery failed archives={len(archives)} manifests={len(manifests)}')
          manifest=json.loads((runtime/'runtime-manifest.json').read_text())
          if manifest.get('matcha_commit')!=MATCHA_COMMIT: raise RuntimeError('runtime Matcha commit mismatch')
          for row in manifest.get('files',[]):
              p=runtime/row['path']
              if not p.is_file() or sha256(p)!=row['sha256']: raise RuntimeError('runtime file integrity mismatch: '+row['path'])
          print('C3_OFFLINE_RUNTIME_SHA_PASS',flush=True)

          debs=sorted((runtime/'debs').glob('*.deb'))
          if not debs: raise RuntimeError('espeak-ng deb bundle missing')
          if os.geteuid()!=0: raise RuntimeError('Kaggle CPU kernel is not root; offline dpkg strategy needs alternate prefix mode')
          run(['dpkg','-i',*debs])
          run(['ldconfig'])
          if shutil.which('espeak-ng') is None: raise RuntimeError('espeak-ng still missing after offline dpkg')
          print('C3_OFFLINE_ESPEAK_PASS',flush=True)

          wheelhouse=runtime/'wheelhouse'
          forced=['lightning==2.6.5','hydra-core==1.3.2','hydra-colorlog==1.2.0','omegaconf==2.3.0','phonemizer==3.3.0','conformer==0.3.2']
          optional=['lightning-utilities','torchmetrics','antlr4-python3-runtime','segments','dlinfo','joblib','attrs','rootutils','rich','einops','inflect','more-itertools','typeguard','Unidecode','diffusers','huggingface-hub','safetensors','Cython','packaging']
          run([sys.executable,'-m','pip','install','--no-index','--no-deps','--find-links',wheelhouse,*forced])
          for dist in optional:
              try: md.version(dist)
              except md.PackageNotFoundError:
                  run([sys.executable,'-m','pip','install','--no-index','--no-deps','--find-links',wheelhouse,dist])
          print('C3_OFFLINE_PY_DEPS_PASS',flush=True)

          matcha=WORK/'Matcha-TTS'
          if matcha.exists(): shutil.rmtree(matcha)
          matcha.mkdir()
          with tarfile.open(runtime/'matcha-source.tar.gz','r:gz') as tf: tf.extractall(matcha)
          run([sys.executable,'setup.py','build_ext','--inplace'],cwd=matcha)

          cleaners=matcha/'matcha/text/cleaners.py'
          source=cleaners.read_text(encoding='utf-8')
          marker='# C3_MATCHA_TEXT_PATCH_V1'
          if marker not in source:
              if 'import unicodedata\n' not in source:
                  source=source.replace('import logging\nimport re\n','import logging\nimport re\nimport unicodedata\n',1)
              needle='    phonemes = collapse_whitespace(phonemes)\n    return phonemes\n'
              replacement='''    phonemes = collapse_whitespace(phonemes)\n    # C3_MATCHA_TEXT_PATCH_V1\n    from matcha.text.symbols import symbols as _c3_symbols\n    _c3_allowed = set(_c3_symbols)\n    _c3_unknown_noncombining = sorted(\n        {ch for ch in phonemes if ch not in _c3_allowed and not unicodedata.combining(ch)}\n    )\n    if _c3_unknown_noncombining:\n        raise ValueError(\n            f"unsupported non-combining Matcha symbols: {_c3_unknown_noncombining}"\n        )\n    phonemes = "".join(\n        ch for ch in phonemes if ch in _c3_allowed or not unicodedata.combining(ch)\n    )\n    return phonemes\n'''
              if needle not in source: raise RuntimeError('Matcha cleaner patch anchor not found')
              cleaners.write_text(source.replace(needle,replacement,1),encoding='utf-8')

          stats_hits=list(INPUT.rglob('STATS.json'))
          e280_hits=[p for p in INPUT.rglob('checkpoint_epoch=279.ckpt') if sha256(p)==E280_SHA]
          if len(stats_hits)!=1: raise RuntimeError(f'STATS discovery expected 1 got {len(stats_hits)}')
          if len(e280_hits)!=1: raise RuntimeError(f'E280 exact SHA discovery expected 1 got {len(e280_hits)}')
          stats=json.loads(stats_hits[0].read_text())
          cleaner_sha=sha256(cleaners)
          expected=str(stats.get('matcha_patched_cleaners_sha256',''))
          if not expected or cleaner_sha!=expected: raise RuntimeError(f'patched cleaner SHA mismatch actual={cleaner_sha} expected={expected}')
          print('C3_OFFLINE_CLEANER_SHA_PASS',flush=True)

          env=dict(os.environ)
          env['PYTHONPATH']=str(matcha)+os.pathsep+env.get('PYTHONPATH','')
          check=textwrap.dedent('''
          import hashlib, json, torch
          import lightning
          from matcha.text.cleaners import english_cleaners2
          import matcha.train
          text="The sixth street shuttle stopped beside three freshly painted shops."
          ph=english_cleaners2(text)
          print("C3_OFFLINE_IMPORT_PASS")
          print("C3_OFFLINE_PHONEME_SHA="+hashlib.sha256(ph.encode()).hexdigest())
          print("C3_OFFLINE_VERSIONS="+json.dumps({"python":__import__('sys').version,"torch":torch.__version__,"cuda":torch.version.cuda,"lightning":lightning.__version__}))
          ''')
          run([sys.executable,'-c',check],cwd=matcha,env=env)

          import torch
          payload=torch.load(e280_hits[0],map_location='cpu',weights_only=False)
          epoch=int(payload.get('epoch',-1))+1
          step=int(payload.get('global_step',-1))
          if (epoch,step)!=(280,140560): raise RuntimeError(f'E280 metadata mismatch epoch={epoch} step={step}')
          print('C3_OFFLINE_E280_LOAD_PASS',flush=True)
          print('C3_OFFLINE_CPU_VALIDATION_PASS',flush=True)
          ''').lstrip()
          compile(script,'validate.py','exec')
          Path('offline-validate/validate.py').write_text(script,encoding='utf-8')
          meta={
              'id':os.environ['KERNEL_ID'],
              'title':'C3 Cori Offline Runtime CPU Validate',
              'code_file':'validate.py',
              'language':'python',
              'kernel_type':'script',
              'is_private':True,
              'enable_gpu':False,
              'enable_internet':False,
              'dataset_sources':[os.environ['KAGGLE_DATASET_ID'],os.environ['RUNTIME_ID']],
              'competition_sources':[],
              'kernel_sources':[],
              'model_sources':[],
          }
          Path('offline-validate/kernel-metadata.json').write_text(json.dumps(meta,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Push CPU-only offline validation
        run: kaggle kernels push -p offline-validate -t 1200
      - name: Wait and persist validation result
        env:
          KERNEL_ID: ${{ steps.ident.outputs.kernel_id }}
        shell: bash
        run: |
          set -u
          STATUS=UNKNOWN
          for i in $(seq 1 120); do
            O=$(kaggle kernels status "$KERNEL_ID" 2>&1 || true)
            echo "C3_OFFLINE_VALIDATE_STATUS ${O##*status }"
            if echo "$O" | grep -q 'KernelWorkerStatus.COMPLETE'; then STATUS=COMPLETE; break; fi
            if echo "$O" | grep -Eq 'KernelWorkerStatus\.(ERROR|FAILED|CANCELLED|CANCELED)'; then STATUS=ERROR; break; fi
            sleep 10
          done
          rm -rf offline-out; mkdir offline-out
          kaggle kernels output "$KERNEL_ID" -p offline-out --force || true
          VALIDATE_STATUS="$STATUS" python - <<'PY'
          from pathlib import Path
          import json, os
          lines=[]
          for p in sorted(Path('offline-out').rglob('*')):
              if not p.is_file(): continue
              text=p.read_text(encoding='utf-8',errors='replace')
              try: rows=json.loads(text)
              except Exception: rows=None
              raw=[]
              if isinstance(rows,list):
                  for row in rows: raw.extend(str(row.get('data','')).splitlines())
              else: raw=text.splitlines()
              for x in raw:
                  if x.strip() and ('C3_OFFLINE_' in x or 'Traceback' in x or 'Error' in x or 'ERROR' in x or 'Exception' in x):
                      lines.append(x[:3000])
          body=['# Kaggle offline runtime CPU validation','', 'Private CPU-only validation; report contains no model/audio bytes or credentials.','', 'terminal_status: '+os.environ.get('VALIDATE_STATUS','UNKNOWN'),'','```text',*lines[-500:],'```','']
          Path('ops/kaggle-offline-runtime-validation-latest.txt').write_text('\n'.join(body)+'\n',encoding='utf-8')
          print('\n'.join(lines[-200:]))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add ops/kaggle-offline-runtime-validation-latest.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record Kaggle offline runtime CPU validation'
            git push origin HEAD:main
          fi
          test "$STATUS" = COMPLETE
      - name: Cleanup
        if: always()
        run: rm -rf runtime-build runtime-upload Matcha-TTS offline-validate offline-out
