name: VELA learned upgrade migration v3b

on:
  push:
    branches: [vela-experiment-infra]
    paths:
      - 'experiments/vela-active-state/learned-upgrade-v3b/**'
      - '.github/workflows/vela-learned-upgrade-v3b.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vela-learned-upgrade-v3b
  cancel-in-progress: false

jobs:
  learned-upgrade-v3b:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vela-experiment-infra
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.2,<3' 'transformers>=4.57,<4.58'
      - name: Run learned upgrade and W2-native migration probe
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          VELA_RESULT_PATH: ops/vela-results/learned-upgrade-v3b-latest.json
        run: python experiments/vela-active-state/learned-upgrade-v3b/run_v3b.py
      - name: Commit result snapshot
        if: always()
        run: |
          if [[ ! -f ops/vela-results/learned-upgrade-v3b-latest.json ]]; then
            mkdir -p ops/vela-results
            printf '{"status":"FAIL_BEFORE_RESULT","source_commit":"%s"}\n' "$GITHUB_SHA" > ops/vela-results/learned-upgrade-v3b-latest.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/vela-results/learned-upgrade-v3b-latest.json
          git diff --cached --quiet || git commit -m 'Record VELA learned upgrade v3b [skip ci]'
          for n in 1 2 3 4; do
            git pull --rebase origin vela-experiment-infra && git push origin HEAD:vela-experiment-infra && break
            sleep $((n*3))
          done
