name: Dashboard Branch Protection One-shot

on:
  push:
    branches: [ops/apply-dashboard-branch-protection]
    paths:
      - ".github/workflows/dashboard-branch-protection-once.yml"

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply and verify main branch protection
        shell: bash
        env:
          DASHBOARD_REPO_TOKEN: ${{ secrets.DASHBOARD_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${DASHBOARD_REPO_TOKEN:-}"
          api="https://api.github.com/repos/jeonghun917/dashboard-control-center/branches/main/protection"
          request_body='{"required_status_checks":{"strict":true,"contexts":["dashboard-public-validation"]},"enforce_admins":true,"required_pull_request_reviews":{"dismiss_stale_reviews":true,"require_code_owner_reviews":false,"required_approving_review_count":0,"require_last_push_approval":false},"restrictions":null,"required_linear_history":true,"allow_force_pushes":false,"allow_deletions":false,"block_creations":false,"required_conversation_resolution":true,"lock_branch":false,"allow_fork_syncing":false}'

          put_body="$(mktemp)"
          get_body="$(mktemp)"
          trap 'rm -f "$put_body" "$get_body"' EXIT

          put_code="$(curl --silent --show-error --output "$put_body" --write-out '%{http_code}' \
            --request PUT \
            --header "Authorization: Bearer ${DASHBOARD_REPO_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            --data "$request_body")"
          echo "apply_http=$put_code"
          if [ "$put_code" != 200 ]; then
            cat "$put_body"
            exit 1
          fi

          get_code="$(curl --silent --show-error --output "$get_body" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${DASHBOARD_REPO_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api")"
          echo "verify_http=$get_code"
          test "$get_code" = 200

          python - "$get_body" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['required_status_checks']['strict'] is True
          assert 'dashboard-public-validation' in data['required_status_checks']['contexts']
          assert data['enforce_admins']['enabled'] is True
          assert data['required_pull_request_reviews']['required_approving_review_count'] == 0
          assert data['required_linear_history']['enabled'] is True
          assert data['allow_force_pushes']['enabled'] is False
          assert data['allow_deletions']['enabled'] is False
          assert data['required_conversation_resolution']['enabled'] is True
          print('branch_protection_verified=true')
          PY
