name: AWS Semantic Review Router PR73 Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aws-semantic-review-router-pr73-once.yml"

permissions:
  id-token: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_MAX_ATTEMPTS: "1"
      AWS_RETRY_MODE: standard
      SEMANTIC_REVIEW_COUNT: "3"
      SEMANTIC_REVIEW_INPUT: semantic-review-router-pr73-input.json
      SEMANTIC_REVIEW_OUTPUT: semantic-review-router-pr73-results.json
      SEMANTIC_REVIEW_MODEL_ID: qwen.qwen3-coder-30b-a3b-v1:0
      TARGET_SHA: d2b8fd1fac17a1f91d67ea86cdbd1853b47efc47
      BASE_SHA: fa33bd155f5cfda549154c1c7cdd6a5b791a8f47

    steps:
      - name: Check out execution repository
        uses: actions/checkout@v4

      - name: Check out exact private Dashboard PR head
        uses: actions/checkout@v4
        with:
          repository: jeonghun917/dashboard-control-center
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          path: dashboard
          fetch-depth: 0
          persist-credentials: false

      - name: Build exact TypeScript PR diff
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          git diff --no-ext-diff "$BASE_SHA" "$TARGET_SHA" -- '*.ts' > ../pr73.diff
          test -s ../pr73.diff

      - name: Build bounded semantic review input
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          code=open('pr73.diff', encoding='utf-8').read()
          req='''Review Dashboard Project Resume Router v0 PR #73. Required properties: stable project/alias routing with collision rejection; legacy GPT resume remains compatible; project resumes cannot grant cross-project write authority; HANDOFF_IMPORT writeback is selected-project-only and rejects stale/concurrent versions; workstreams cannot overwrite project primary automatically and terminal workstreams are immutable; dispatch messages are request-only and exact target/claimer constrained; meta resume is read/index only and cannot grant action authority; no hidden automatic provider/merge/deploy authority. Report concrete correctness, authorization, concurrency, data-integrity, async, or boundary defects only. The supplied code is the TypeScript diff, so line numbers refer to the review input, not original files.'''
          payload={
              'task_id':'dashboard-router-pr73-semantic-review',
              'language':'TypeScript unified diff',
              'requirements':req,
              'code':code,
          }
          open('semantic-review-router-pr73-input.json','w',encoding='utf-8').write(json.dumps(payload, ensure_ascii=False))
          print({'review_chars':len(code)})
          PY

      - name: Configure semantic review credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ format('arn:aws:iam::{0}:role/general-ai-semantic-review', vars.AWS_ACCOUNT_ID) }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: opened-arm-router-pr73-review
          mask-aws-account-id: true
          disable-retry: true

      - name: Run three independent semantic reviewers
        shell: bash
        run: |
          set -euo pipefail
          python3 infra/aws/semantic-review/pool.py

      - name: Verify hypothesis-only contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data=json.load(open('semantic-review-router-pr73-results.json'))
          assert data['schema']=='semantic-review-pool-v0'
          assert data['authority']=='HYPOTHESIS_ONLY'
          assert data['production_pass_fail_authority'] is False
          assert data['automatic_retry'] is False
          assert data['review_budget']==3
          assert data['completed_reviews']==3
          print(json.dumps({
            'completed_reviews': data['completed_reviews'],
            'finding_count': data['finding_count'],
            'wall_latency_ms': data['wall_latency_ms'],
            'usage': data['usage'],
            'aggregated_findings': data['aggregated_findings'],
          }, ensure_ascii=False))
          PY

      - name: Upload semantic review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-review-router-pr73
          path: semantic-review-router-pr73-results.json
          if-no-files-found: ignore
          retention-days: 14
