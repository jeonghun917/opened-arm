name: VELA Mamba state checkpoint probe

on:
  push:
    branches: [vela-experiment-infra]
    paths:
      - 'experiments/vela-active-state/mamba-m0-v1/**'
      - '.github/workflows/vela-mamba-m0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mamba-m0:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vela-experiment-infra
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.2,<3' 'transformers>=4.49,<5'
      - name: Run Mamba cache checkpoint probe
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          VELA_RESULT_PATH: ops/vela-results/mamba-m0-latest.json
        run: |
          python experiments/vela-active-state/mamba-m0-v1/mamba_state_restore.py
      - name: Commit result snapshot
        if: always()
        run: |
          if [[ ! -f ops/vela-results/mamba-m0-latest.json ]]; then
            mkdir -p ops/vela-results
            printf '{"status":"FAIL_BEFORE_RESULT","source_commit":"%s"}\n' "$GITHUB_SHA" > ops/vela-results/mamba-m0-latest.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/vela-results/mamba-m0-latest.json
          git diff --cached --quiet || git commit -m 'Record VELA Mamba M0 probe [skip ci]'
          git push origin HEAD:vela-experiment-infra
