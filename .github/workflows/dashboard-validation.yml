name: Dashboard Public Validation

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact dashboard-control-center commit SHA to validate
        required: true
  push:
    branches: [main]
    paths:
      - ".github/workflows/dashboard-validation.yml"
      - "ops/dashboard-validation-target.txt"

permissions:
  contents: write

concurrency:
  group: dashboard-public-validation
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public runner repository
        uses: actions/checkout@v4
        with:
          path: runner-repo
          fetch-depth: 0

      - name: Resolve exact dashboard SHA
        id: target
        shell: bash
        env:
          INPUT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || '' }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SHA:-}" ]; then
            TARGET_SHA="$INPUT_SHA"
          else
            TARGET_SHA="$(tr -d '[:space:]' < runner-repo/ops/dashboard-validation-target.txt)"
          fi
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Target must be an exact 40-character lowercase commit SHA"
            exit 1
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Validating dashboard SHA $TARGET_SHA"

      - name: Credential gate
        id: credential
        shell: bash
        env:
          DASHBOARD_REPO_TOKEN: ${{ secrets.DASHBOARD_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${DASHBOARD_REPO_TOKEN:-}"

      - name: Publish pending dashboard status
        id: pending_status
        continue-on-error: true
        shell: bash
        env:
          DASHBOARD_REPO_TOKEN: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${DASHBOARD_REPO_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/jeonghun917/dashboard-control-center/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"dashboard-public-validation\",\"description\":\"Public runner validation started\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            >/dev/null

      - name: Checkout exact private dashboard SHA
        id: checkout
        uses: actions/checkout@v4
        with:
          repository: jeonghun917/dashboard-control-center
          ref: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          path: dashboard
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout identity and credential cleanup
        id: identity
        shell: bash
        working-directory: dashboard
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "actual_sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          test "$ACTUAL_SHA" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "Checkout credential unexpectedly persisted"
            exit 1
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Clean install
        id: npm_ci
        working-directory: dashboard
        run: npm ci

      - name: Full dashboard check
        id: npm_check
        working-directory: dashboard
        run: npm run check

      - name: Publish final dashboard status
        id: final_status
        if: always() && steps.target.outputs.sha != ''
        continue-on-error: true
        shell: bash
        env:
          DASHBOARD_REPO_TOKEN: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGET_STATUS: ${{ steps.target.outcome }}
          CREDENTIAL_STATUS: ${{ steps.credential.outcome }}
          CHECKOUT_STATUS: ${{ steps.checkout.outcome }}
          IDENTITY_STATUS: ${{ steps.identity.outcome }}
          NPM_CI_STATUS: ${{ steps.npm_ci.outcome }}
          NPM_CHECK_STATUS: ${{ steps.npm_check.outcome }}
        run: |
          set -euo pipefail
          state=failure
          description="Public runner validation failed"
          if [ "$TARGET_STATUS" = success ] && \
             [ "$CREDENTIAL_STATUS" = success ] && \
             [ "$CHECKOUT_STATUS" = success ] && \
             [ "$IDENTITY_STATUS" = success ] && \
             [ "$NPM_CI_STATUS" = success ] && \
             [ "$NPM_CHECK_STATUS" = success ]; then
            state=success
            description="npm ci + npm run check passed"
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${DASHBOARD_REPO_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/jeonghun917/dashboard-control-center/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"${state}\",\"context\":\"dashboard-public-validation\",\"description\":\"${description}\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            >/dev/null

      - name: Persist validation evidence
        if: always()
        shell: bash
        working-directory: runner-repo
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          ACTUAL_SHA: ${{ steps.identity.outputs.actual_sha }}
          TARGET_STATUS: ${{ steps.target.outcome }}
          CREDENTIAL_STATUS: ${{ steps.credential.outcome }}
          PENDING_STATUS: ${{ steps.pending_status.outcome }}
          CHECKOUT_STATUS: ${{ steps.checkout.outcome }}
          IDENTITY_STATUS: ${{ steps.identity.outcome }}
          NPM_CI_STATUS: ${{ steps.npm_ci.outcome }}
          NPM_CHECK_STATUS: ${{ steps.npm_check.outcome }}
          FINAL_STATUS: ${{ steps.final_status.outcome }}
        run: |
          set -euo pipefail
          mkdir -p ops
          python - <<'PY'
          import json, os
          payload = {
              "schema": 2,
              "targetSha": os.environ.get("TARGET_SHA", ""),
              "actualSha": os.environ.get("ACTUAL_SHA", ""),
              "targetResolution": os.environ.get("TARGET_STATUS", ""),
              "credentialGate": os.environ.get("CREDENTIAL_STATUS", ""),
              "pendingStatusPublish": os.environ.get("PENDING_STATUS", ""),
              "privateCheckout": os.environ.get("CHECKOUT_STATUS", ""),
              "identityCheck": os.environ.get("IDENTITY_STATUS", ""),
              "npmCi": os.environ.get("NPM_CI_STATUS", ""),
              "npmRunCheck": os.environ.get("NPM_CHECK_STATUS", ""),
              "finalStatusPublish": os.environ.get("FINAL_STATUS", ""),
              "statusContext": "dashboard-public-validation",
              "runId": os.environ.get("GITHUB_RUN_ID", ""),
              "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }
          with open("ops/dashboard-validation.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add ops/dashboard-validation.json
          if ! git diff --cached --quiet; then
            git commit -m "Record dashboard public validation result"
            git push origin HEAD:main
          fi
