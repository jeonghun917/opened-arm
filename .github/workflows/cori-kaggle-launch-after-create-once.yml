name: Cori Kaggle Launch After Create Once

# Diagnostic safety: do not relaunch a paid/quota GPU kernel on every PR synchronization.
# This workflow is manual-only until the current portability failure is understood.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled-until-diagnosed:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'C3_KAGGLE_AUTO_RELAUNCH_DISABLED'
          echo 'Re-enable the exact benchmark launcher only after a diagnosed fix is committed.'
