name: VELA Gated DeltaNet spec v1

on:
  push:
    branches: [vela-experiment-infra]
    paths:
      - 'experiments/vela-active-state/gated-deltanet-spec-v1/**'
      - '.github/workflows/vela-gated-deltanet-spec-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vela-gated-deltanet-spec-v1
  cancel-in-progress: true

jobs:
  spec-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vela-experiment-infra
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.7,<3'
          python -m pip install 'flash-linear-attention[cpu]'
      - name: Run Gated DeltaNet spec probe
        env:
          VELA_RESULT_PATH: ops/vela-results/gated-deltanet-spec-v1-latest.json
        run: python experiments/vela-active-state/gated-deltanet-spec-v1/gated_deltanet_spec_probe.py
      - name: Commit result snapshot
        if: always()
        run: |
          if [[ ! -f ops/vela-results/gated-deltanet-spec-v1-latest.json ]]; then
            mkdir -p ops/vela-results
            printf '{"status":"FAIL_BEFORE_RESULT","source_commit":"%s"}\n' "$GITHUB_SHA" > ops/vela-results/gated-deltanet-spec-v1-latest.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/vela-results/gated-deltanet-spec-v1-latest.json
          git diff --cached --quiet || git commit -m 'Record VELA Gated DeltaNet spec v1 [skip ci]'
          for n in 1 2 3 4 5; do
            git pull --rebase origin vela-experiment-infra && git push origin HEAD:vela-experiment-infra && break
            sleep $((n*3))
          done
