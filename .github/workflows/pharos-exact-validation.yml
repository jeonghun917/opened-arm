name: Pharos Exact Validation

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact pharos-orbis commit SHA to validate
        required: true
  push:
    branches: [main]
    paths:
      - ".github/workflows/pharos-exact-validation.yml"
      - "ops/pharos-validation-target.txt"

permissions:
  contents: read

concurrency:
  group: pharos-exact-validation
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      target_resolution: ${{ steps.target.outcome }}
      credential_gate: ${{ steps.credential.outcome }}
      pending_status: ${{ steps.pending_status.outcome }}
    steps:
      - name: Checkout public runner repository
        uses: actions/checkout@v4
        with:
          path: runner-repo
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact Pharos SHA
        id: target
        shell: bash
        env:
          INPUT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || '' }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SHA:-}" ]; then
            target="$INPUT_SHA"
          else
            target="$(tr -d '[:space:]' < runner-repo/ops/pharos-validation-target.txt)"
          fi
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"

      - name: Check private checkout credential
        id: credential
        continue-on-error: true
        shell: bash
        env:
          PHAROS_REPO_TOKEN: ${{ secrets.PHAROS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${PHAROS_REPO_TOKEN:-}"

      - name: Publish pending Pharos status
        id: pending_status
        if: steps.credential.outcome == 'success' && steps.target.outputs.sha != ''
        continue-on-error: true
        shell: bash
        env:
          PHAROS_REPO_TOKEN: ${{ secrets.PHAROS_REPO_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${PHAROS_REPO_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/jeonghun917/pharos-orbis/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"pharos-public-validation\",\"description\":\"Public exact-SHA validation started\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            >/dev/null

      - name: Require preflight
        if: always()
        shell: bash
        env:
          TARGET_STATUS: ${{ steps.target.outcome }}
          CREDENTIAL_STATUS: ${{ steps.credential.outcome }}
          PENDING_STATUS: ${{ steps.pending_status.outcome }}
        run: |
          set -euo pipefail
          test "$TARGET_STATUS" = success
          test "$CREDENTIAL_STATUS" = success
          test "$PENDING_STATUS" = success

  validation:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      actual_sha: ${{ steps.identity.outputs.actual_sha }}
      private_checkout: ${{ steps.checkout.outcome }}
      identity_check: ${{ steps.identity.outcome }}
      recipe_contract: ${{ steps.recipe_contract.outcome }}
      recipe_run: ${{ steps.recipe.outcome }}
      clean_after: ${{ steps.clean_after.outcome }}
    steps:
      - name: Checkout exact private Pharos SHA
        id: checkout
        uses: actions/checkout@v4
        with:
          repository: jeonghun917/pharos-orbis
          ref: ${{ needs.preflight.outputs.target_sha }}
          token: ${{ secrets.PHAROS_REPO_TOKEN }}
          path: pharos
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout identity
        id: identity
        shell: bash
        working-directory: pharos
        env:
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
        run: |
          set -euo pipefail
          actual="$(/usr/bin/git rev-parse HEAD)"
          echo "actual_sha=$actual" >> "$GITHUB_OUTPUT"
          test "$actual" = "$TARGET_SHA"
          test -z "$(/usr/bin/git status --porcelain)"
          if /usr/bin/git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "Checkout credential unexpectedly persisted"
            exit 1
          fi

      - name: Require frozen Pharos validation recipe
        id: recipe_contract
        shell: bash
        working-directory: pharos
        run: |
          set -euo pipefail
          test -f ops/validation/recipe-v0.sh
          test -s ops/validation/recipe-v0.sh

      - name: Run frozen Pharos validation recipe
        id: recipe
        shell: bash
        working-directory: pharos
        run: |
          set -euo pipefail
          bash ops/validation/recipe-v0.sh

      - name: Verify validation left checkout clean
        id: clean_after
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        working-directory: pharos
        run: |
          test -z "$(/usr/bin/git status --porcelain)"

  finalize:
    if: always()
    needs: [preflight, validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout public runner repository without credentials
        uses: actions/checkout@v4
        with:
          path: runner-repo
          fetch-depth: 0
          persist-credentials: false

      - name: Publish final Pharos status
        id: final_status
        if: needs.preflight.outputs.target_sha != ''
        continue-on-error: true
        shell: bash
        env:
          PHAROS_REPO_TOKEN: ${{ secrets.PHAROS_REPO_TOKEN }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          TARGET_STATUS: ${{ needs.preflight.outputs.target_resolution }}
          CREDENTIAL_STATUS: ${{ needs.preflight.outputs.credential_gate }}
          PENDING_STATUS: ${{ needs.preflight.outputs.pending_status }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
          CHECKOUT_STATUS: ${{ needs.validation.outputs.private_checkout }}
          IDENTITY_STATUS: ${{ needs.validation.outputs.identity_check }}
          RECIPE_CONTRACT_STATUS: ${{ needs.validation.outputs.recipe_contract }}
          RECIPE_STATUS: ${{ needs.validation.outputs.recipe_run }}
          CLEAN_AFTER_STATUS: ${{ needs.validation.outputs.clean_after }}
        run: |
          set -euo pipefail
          state=failure
          description="Public exact-SHA validation failed"
          if [ "$TARGET_STATUS" = success ] && \
             [ "$CREDENTIAL_STATUS" = success ] && \
             [ "$PENDING_STATUS" = success ] && \
             [ "$VALIDATION_RESULT" = success ] && \
             [ "$CHECKOUT_STATUS" = success ] && \
             [ "$IDENTITY_STATUS" = success ] && \
             [ "$RECIPE_CONTRACT_STATUS" = success ] && \
             [ "$RECIPE_STATUS" = success ] && \
             [ "$CLEAN_AFTER_STATUS" = success ]; then
            state=success
            description="Frozen Pharos validation recipe passed"
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${PHAROS_REPO_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/jeonghun917/pharos-orbis/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"${state}\",\"context\":\"pharos-public-validation\",\"description\":\"${description}\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            >/dev/null

      - name: Persist Pharos validation evidence
        id: evidence
        if: always()
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        working-directory: runner-repo
        env:
          OPENED_ARM_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          ACTUAL_SHA: ${{ needs.validation.outputs.actual_sha }}
          TARGET_STATUS: ${{ needs.preflight.outputs.target_resolution }}
          CREDENTIAL_STATUS: ${{ needs.preflight.outputs.credential_gate }}
          PENDING_STATUS: ${{ needs.preflight.outputs.pending_status }}
          CHECKOUT_STATUS: ${{ needs.validation.outputs.private_checkout }}
          IDENTITY_STATUS: ${{ needs.validation.outputs.identity_check }}
          RECIPE_CONTRACT_STATUS: ${{ needs.validation.outputs.recipe_contract }}
          RECIPE_STATUS: ${{ needs.validation.outputs.recipe_run }}
          CLEAN_AFTER_STATUS: ${{ needs.validation.outputs.clean_after }}
          FINAL_STATUS: ${{ steps.final_status.outcome }}
        run: |
          auth="$(printf 'x-access-token:%s' "$OPENED_ARM_TOKEN" | base64 | tr -d '\n')"
          git_auth=(/usr/bin/git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth")
          /usr/bin/git config user.name github-actions[bot]
          /usr/bin/git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          "${git_auth[@]}" pull --rebase origin main
          mkdir -p ops
          /usr/bin/python3 - <<'PY'
          import json, os
          def outcome(name):
              return os.environ.get(name, "") or "skipped"
          payload = {
              "schema": 1,
              "targetRepository": "jeonghun917/pharos-orbis",
              "targetSha": os.environ.get("TARGET_SHA", ""),
              "actualSha": os.environ.get("ACTUAL_SHA", ""),
              "recipeVersion": "v0",
              "recipePath": "ops/validation/recipe-v0.sh",
              "targetResolution": outcome("TARGET_STATUS"),
              "credentialGate": outcome("CREDENTIAL_STATUS"),
              "pendingStatusPublish": outcome("PENDING_STATUS"),
              "privateCheckout": outcome("CHECKOUT_STATUS"),
              "identityCheck": outcome("IDENTITY_STATUS"),
              "recipeContract": outcome("RECIPE_CONTRACT_STATUS"),
              "recipeRun": outcome("RECIPE_STATUS"),
              "cleanAfter": outcome("CLEAN_AFTER_STATUS"),
              "finalStatusPublish": outcome("FINAL_STATUS"),
              "statusContext": "pharos-public-validation",
              "runId": os.environ.get("GITHUB_RUN_ID", ""),
              "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }
          with open("ops/pharos-exact-validation.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          /usr/bin/git add ops/pharos-exact-validation.json
          if ! /usr/bin/git diff --cached --quiet; then
            /usr/bin/git commit -m "Record Pharos exact validation result"
            "${git_auth[@]}" push origin HEAD:main
          fi

      - name: Require finalization
        if: always()
        shell: bash
        env:
          PENDING_STATUS: ${{ needs.preflight.outputs.pending_status }}
          FINAL_STATUS: ${{ steps.final_status.outcome }}
          EVIDENCE_STATUS: ${{ steps.evidence.outcome }}
        run: |
          set -euo pipefail
          test "$PENDING_STATUS" = success
          test "$FINAL_STATUS" = success
          test "$EVIDENCE_STATUS" = success
