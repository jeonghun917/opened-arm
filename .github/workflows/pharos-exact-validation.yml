name: Pharos Exact Validation

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact pharos-orbis commit SHA to validate
        required: true
  push:
    branches: [main]
    paths:
      - ".github/workflows/pharos-exact-validation.yml"
      - "ops/pharos-validation-target.txt"

permissions:
  contents: write

concurrency:
  group: pharos-exact-validation
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public runner repository
        uses: actions/checkout@v4
        with:
          path: runner-repo
          fetch-depth: 0

      - name: Resolve exact Pharos SHA
        id: target
        shell: bash
        env:
          INPUT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || '' }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SHA:-}" ]; then
            target="$INPUT_SHA"
          else
            target="$(tr -d '[:space:]' < runner-repo/ops/pharos-validation-target.txt)"
          fi
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"

      - name: Check private checkout credential
        id: credential
        shell: bash
        env:
          PHAROS_REPO_TOKEN: ${{ secrets.PHAROS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${PHAROS_REPO_TOKEN:-}"

      - name: Publish pending Pharos status
        id: pending_status
        continue-on-error: true
        shell: bash
        env:
          PHAROS_REPO_TOKEN: ${{ secrets.PHAROS_REPO_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${PHAROS_REPO_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/jeonghun917/pharos-orbis/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"pharos-public-validation\",\"description\":\"Public exact-SHA validation started\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            >/dev/null

      - name: Checkout exact private Pharos SHA
        id: checkout
        uses: actions/checkout@v4
        with:
          repository: jeonghun917/pharos-orbis
          ref: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.PHAROS_REPO_TOKEN }}
          path: pharos
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout identity
        id: identity
        shell: bash
        working-directory: pharos
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "actual_sha=$actual" >> "$GITHUB_OUTPUT"
          test "$actual" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "Checkout credential unexpectedly persisted"
            exit 1
          fi

      - name: Require frozen Pharos validation recipe
        id: recipe_contract
        shell: bash
        working-directory: pharos
        run: |
          set -euo pipefail
          test -f ops/validation/recipe-v0.sh
          test -s ops/validation/recipe-v0.sh

      - name: Run frozen Pharos validation recipe
        id: recipe
        shell: bash
        working-directory: pharos
        run: |
          set -euo pipefail
          bash ops/validation/recipe-v0.sh

      - name: Verify validation left checkout clean
        id: clean_after
        shell: bash
        working-directory: pharos
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - name: Publish final Pharos status
        id: final_status
        if: always() && steps.target.outputs.sha != ''
        continue-on-error: true
        shell: bash
        env:
          PHAROS_REPO_TOKEN: ${{ secrets.PHAROS_REPO_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGET_STATUS: ${{ steps.target.outcome }}
          CREDENTIAL_STATUS: ${{ steps.credential.outcome }}
          CHECKOUT_STATUS: ${{ steps.checkout.outcome }}
          IDENTITY_STATUS: ${{ steps.identity.outcome }}
          RECIPE_CONTRACT_STATUS: ${{ steps.recipe_contract.outcome }}
          RECIPE_STATUS: ${{ steps.recipe.outcome }}
          CLEAN_AFTER_STATUS: ${{ steps.clean_after.outcome }}
        run: |
          set -euo pipefail
          state=failure
          description="Public exact-SHA validation failed"
          if [ "$TARGET_STATUS" = success ] && \
             [ "$CREDENTIAL_STATUS" = success ] && \
             [ "$CHECKOUT_STATUS" = success ] && \
             [ "$IDENTITY_STATUS" = success ] && \
             [ "$RECIPE_CONTRACT_STATUS" = success ] && \
             [ "$RECIPE_STATUS" = success ] && \
             [ "$CLEAN_AFTER_STATUS" = success ]; then
            state=success
            description="Frozen Pharos validation recipe passed"
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${PHAROS_REPO_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/jeonghun917/pharos-orbis/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"${state}\",\"context\":\"pharos-public-validation\",\"description\":\"${description}\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            >/dev/null

      - name: Persist Pharos validation evidence
        if: always()
        shell: bash
        working-directory: runner-repo
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          ACTUAL_SHA: ${{ steps.identity.outputs.actual_sha }}
          TARGET_STATUS: ${{ steps.target.outcome }}
          CREDENTIAL_STATUS: ${{ steps.credential.outcome }}
          PENDING_STATUS: ${{ steps.pending_status.outcome }}
          CHECKOUT_STATUS: ${{ steps.checkout.outcome }}
          IDENTITY_STATUS: ${{ steps.identity.outcome }}
          RECIPE_CONTRACT_STATUS: ${{ steps.recipe_contract.outcome }}
          RECIPE_STATUS: ${{ steps.recipe.outcome }}
          CLEAN_AFTER_STATUS: ${{ steps.clean_after.outcome }}
          FINAL_STATUS: ${{ steps.final_status.outcome }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          mkdir -p ops
          python - <<'PY'
          import json, os
          payload = {
              "schema": 1,
              "targetRepository": "jeonghun917/pharos-orbis",
              "targetSha": os.environ.get("TARGET_SHA", ""),
              "actualSha": os.environ.get("ACTUAL_SHA", ""),
              "recipeVersion": "v0",
              "recipePath": "ops/validation/recipe-v0.sh",
              "targetResolution": os.environ.get("TARGET_STATUS", ""),
              "credentialGate": os.environ.get("CREDENTIAL_STATUS", ""),
              "pendingStatusPublish": os.environ.get("PENDING_STATUS", ""),
              "privateCheckout": os.environ.get("CHECKOUT_STATUS", ""),
              "identityCheck": os.environ.get("IDENTITY_STATUS", ""),
              "recipeContract": os.environ.get("RECIPE_CONTRACT_STATUS", ""),
              "recipeRun": os.environ.get("RECIPE_STATUS", ""),
              "cleanAfter": os.environ.get("CLEAN_AFTER_STATUS", ""),
              "finalStatusPublish": os.environ.get("FINAL_STATUS", ""),
              "statusContext": "pharos-public-validation",
              "runId": os.environ.get("GITHUB_RUN_ID", ""),
              "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }
          with open("ops/pharos-exact-validation.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          git add ops/pharos-exact-validation.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Pharos exact validation result"
            git push origin HEAD:main
          fi

      - name: Require status publication
        if: always()
        shell: bash
        env:
          PENDING_STATUS: ${{ steps.pending_status.outcome }}
          FINAL_STATUS: ${{ steps.final_status.outcome }}
        run: |
          set -euo pipefail
          test "$PENDING_STATUS" = success
          test "$FINAL_STATUS" = success
