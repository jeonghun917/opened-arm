name: VELA RWKV-7 actual-weight M0 checkpoint probe

on:
  push:
    branches: [vela-experiment-infra]
    paths:
      - 'experiments/vela-active-state/rwkv7-m0-v1/**'
      - '.github/workflows/vela-rwkv7-m0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rwkv7-m0:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vela-experiment-infra
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.2,<3' huggingface_hub numpy
      - name: Run pinned official RWKV-7 actual-weight state probe
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          VELA_RESULT_PATH: ops/vela-results/rwkv7-m0-latest.json
        run: python experiments/vela-active-state/rwkv7-m0-v1/rwkv7_official_state_restore.py
      - name: Commit result snapshot
        if: always()
        run: |
          if [[ ! -f ops/vela-results/rwkv7-m0-latest.json ]]; then
            mkdir -p ops/vela-results
            printf '{"status":"FAIL_BEFORE_RESULT","source_commit":"%s"}\n' "$GITHUB_SHA" > ops/vela-results/rwkv7-m0-latest.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/vela-results/rwkv7-m0-latest.json
          git diff --cached --quiet || git commit -m 'Record VELA RWKV-7 M0 probe [skip ci]'
          for i in 1 2 3 4; do
            git pull --rebase origin vela-experiment-infra || true
            git push origin HEAD:vela-experiment-infra && break
            sleep $((i * 3))
          done
