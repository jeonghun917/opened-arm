name: Dashboard Control Plane Sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dashboard-control-plane-sync.yml"
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Outer serialization only. The Dashboard server owns the durable lease and
# per-GitHub-run idempotency boundary, so correctness does not depend on this queue.
concurrency:
  group: dashboard-control-plane-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Mint scoped scheduler OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('dashboard-control-center-scheduler');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Refresh dashboard control plane
        shell: bash
        env:
          DASHBOARD_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT

          for attempt in 1 2 3 4 5 6; do
            code="$(curl --silent --show-error --max-time 90 \
              --request POST \
              --header "Authorization: Bearer ${DASHBOARD_OIDC_TOKEN}" \
              --header "Accept: application/json" \
              --output "$tmp" \
              --write-out '%{http_code}' \
              https://dashboard-control-center.vercel.app/api/cron/sync || true)"

            echo "Dashboard sync attempt ${attempt} -> HTTP ${code}"
            cat "$tmp" || true

            if [ "$code" = "200" ]; then
              exit 0
            fi

            # 409 means this exact GitHub run attempt is durably recorded as failed.
            # Reissuing the same invocation cannot repair it; a GitHub rerun gets a
            # new run_attempt and therefore a fresh server idempotency identity.
            if [ "$code" = "409" ]; then
              echo "Dashboard scheduler invocation is durably failed; rerun the workflow for a fresh invocation identity."
              exit 1
            fi

            # 202 = same invocation still running; 423 = another invocation owns
            # the server lease. Both are safe to poll without starting duplicate work.
            if [ "$attempt" -lt 6 ]; then
              sleep 20
            fi
          done

          echo "Dashboard control-plane sync failed after retries."
          exit 1
