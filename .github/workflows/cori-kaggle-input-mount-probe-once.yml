name: Cori Kaggle Input Mount Probe Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cori-kaggle-input-mount-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/kaggle-p100-port'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_DATASET_ID: ${{ secrets.KAGGLE_DATASET_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: python -m pip install --quiet --upgrade kaggle
      - name: Resolve owner and build CPU mount probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path
          token=os.environ['KAGGLE_API_TOKEN']
          configured=os.environ['KAGGLE_DATASET_ID'].strip()
          _,slug=configured.split('/',1)
          req=urllib.request.Request('https://www.kaggle.com/api/v1/oauth2/introspect',data=urllib.parse.urlencode({'token':token}).encode(),headers={'Content-Type':'application/x-www-form-urlencoded'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          owner=(data.get('username') or '').strip()
          if not data.get('active') or not owner: raise SystemExit('inactive Kaggle token')
          dataset=f'{owner}/{slug}'
          kernel=f'{owner}/c3-cori-input-mount-probe'
          Path('probe').mkdir(exist_ok=True)
          Path('probe/probe.py').write_text(r'''import os
from pathlib import Path
root=Path('/kaggle/input')
print('C3_PROBE_INPUT_EXISTS',root.exists())
print('C3_PROBE_TOP',[(p.name,p.is_dir(),p.is_symlink(),str(p.resolve())[:240]) for p in root.iterdir()] if root.exists() else [])
count=0
for base,dirs,files in os.walk(root,followlinks=True):
    rel=os.path.relpath(base,root)
    print('C3_PROBE_DIR',rel,'dirs=',dirs[:20],'files=',files[:40])
    count+=1
    if count>=80:
        print('C3_PROBE_TRUNCATED')
        break
print('C3_PROBE_DONE dirs_seen=',count)
''',encoding='utf-8')
          meta={'id':kernel,'title':'C3 Cori Input Mount Probe','code_file':'probe.py','language':'python','kernel_type':'script','is_private':True,'enable_gpu':False,'enable_internet':False,'dataset_sources':[dataset],'competition_sources':[],'kernel_sources':[],'model_sources':[]}
          Path('probe/kernel-metadata.json').write_text(json.dumps(meta,indent=2)+'\n',encoding='utf-8')
          Path('kernel-id.txt').write_text(kernel+'\n',encoding='utf-8')
          print('C3_PROBE_DATASET='+dataset)
          PY
      - name: Push CPU probe
        run: kaggle kernels push -p probe -t 600
      - name: Wait terminal
        shell: bash
        run: |
          set -euo pipefail
          K=$(cat kernel-id.txt)
          for i in $(seq 1 60); do
            O=$(kaggle kernels status "$K" 2>&1 || true)
            echo "C3_PROBE_STATUS ${O##*status }"
            if echo "$O" | grep -Eq 'KernelWorkerStatus\.(COMPLETE|ERROR|FAILED|CANCELLED|CANCELED)'; then break; fi
            sleep 10
          done
          rm -rf probe_out; mkdir probe_out
          kaggle kernels output "$K" -p probe_out --force || true
          python - <<'PY'
          from pathlib import Path
          for p in Path('probe_out').rglob('*.log'):
              text=p.read_text(encoding='utf-8',errors='replace')
              for line in text.splitlines():
                  if 'C3_PROBE_' in line or 'Traceback' in line or 'RuntimeError' in line:
                      print(line[:3000])
          PY
      - name: Cleanup
        if: always()
        run: rm -rf probe probe_out kernel-id.txt
