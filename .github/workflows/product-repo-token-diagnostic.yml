name: Product Repo Token Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/product-repo-token-diagnostic.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe private repository visibility with the exact shared token
        env:
          TARGET_REPO_TOKEN: ${{ secrets.CODING_WORKER_GITHUB_TOKEN || secrets.PHAROS_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TARGET_REPO_TOKEN:-}"
          probe() {
            local repo="$1"
            local code
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer ${TARGET_REPO_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${repo}")"
            echo "repo_visibility ${repo} ${code}"
          }
          probe jeonghun917/pharos-orbis
          probe jeonghun917/Ars-Mentis
