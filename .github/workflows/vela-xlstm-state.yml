name: VELA xLSTM state checkpoint probe

on:
  push:
    branches: [vela-experiment-infra]
    paths:
      - 'experiments/vela-active-state/xlstm-state-v1/**'
      - '.github/workflows/vela-xlstm-state.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  xlstm-state:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vela-experiment-infra

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned xLSTM runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.2,<3'
          python -m pip install mlstm_kernels
          python -m pip install 'git+https://github.com/NX-AI/xlstm.git@f539ba80770ba2b9acd5bf4c1e0f0d4827494184'

      - name: Run xLSTM state probe
        env:
          VELA_RESULT_PATH: ops/vela-results/xlstm-state-latest.json
        run: python experiments/vela-active-state/xlstm-state-v1/xlstm_state_restore.py

      - name: Commit result snapshot
        if: always()
        run: |
          if [[ ! -f ops/vela-results/xlstm-state-latest.json ]]; then
            mkdir -p ops/vela-results
            printf '{"status":"FAIL_BEFORE_RESULT","source_commit":"%s"}\n' "$GITHUB_SHA" > ops/vela-results/xlstm-state-latest.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/vela-results/xlstm-state-latest.json
          git diff --cached --quiet || git commit -m 'Record VELA xLSTM state probe [skip ci]'
          git push origin HEAD:vela-experiment-infra
