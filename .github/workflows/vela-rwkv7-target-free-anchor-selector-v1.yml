name: VELA RWKV7 target-free anchor selector v1

on:
  push:
    branches: [vela-experiment-infra]
    paths:
      - 'experiments/vela-active-state/rwkv7-target-free-anchor-selector-v1/**'
      - '.github/workflows/vela-rwkv7-target-free-anchor-selector-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vela-rwkv7-target-free-anchor-selector-v1
  cancel-in-progress: false

jobs:
  rwkv7-target-free-anchor-selector-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vela-experiment-infra
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.2,<3' huggingface_hub
      - name: Run RWKV-7 target-free anchor selector
        env:
          VELA_RESULT_PATH: ops/vela-results/rwkv7-target-free-anchor-selector-v1-latest.json
        run: python experiments/vela-active-state/rwkv7-target-free-anchor-selector-v1/rwkv7_target_free_selector.py
      - name: Commit result snapshot
        if: always()
        run: |
          if [[ ! -f ops/vela-results/rwkv7-target-free-anchor-selector-v1-latest.json ]]; then
            mkdir -p ops/vela-results
            printf '{"status":"FAIL_BEFORE_RESULT","source_commit":"%s"}\n' "$GITHUB_SHA" > ops/vela-results/rwkv7-target-free-anchor-selector-v1-latest.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/vela-results/rwkv7-target-free-anchor-selector-v1-latest.json
          git diff --cached --quiet || git commit -m 'Record VELA RWKV7 target-free selector v1 [skip ci]'
          for n in 1 2 3 4; do
            git pull --rebase origin vela-experiment-infra && git push origin HEAD:vela-experiment-infra && break
            sleep $((n*3))
          done
