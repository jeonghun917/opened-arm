name: Dashboard Route Consolidation Preview Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dashboard-route-consolidation-preview-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://dashboard-control-center-otiiokh27-ashite1010-3572s-projects.vercel.app
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe legacy URLs through rewrites
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BYPASS"
          code() { curl -sS -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: $BYPASS" "$@"; }
          health="$(code "$BASE/api/health")"
          gh_status="$(code "$BASE/api/github/status")"
          gh_file="$(code "$BASE/api/github/file?repo=jeonghun917/c3-voice-lab&path=ops/cori-selfheal-state.json")"
          gh_action="$(code -X POST -H 'content-type: application/json' -H 'x-idempotency-key: route-probe-gh' --data '{"repo":"jeonghun917/dashboard-control-center","type":"rerun_failed","runId":1}' "$BASE/api/github/action")"
          li_status="$(code "$BASE/api/lightning/status")"
          li_action="$(code -X POST -H 'content-type: application/json' -H 'x-idempotency-key: route-probe-li' --data '{"type":"stop_job","jobName":"probe"}' "$BASE/api/lightning/action")"
          test "$health" = 200
          test "$gh_status" = 401
          test "$gh_file" = 401
          test "$gh_action" = 401
          test "$li_status" = 401
          test "$li_action" = 401
          mkdir -p ops
          printf '{\n  "deployment": "dpl_DoktWtvdEdNuDG56iJMDyg87UcUy",\n  "dashboardSha": "c1a05c61d96b5ccc3954d4f276aba1ac6592653f",\n  "functionCount": {"node": 8, "python": 1, "total": 9},\n  "health": "%s",\n  "githubStatusLegacy": "%s",\n  "githubFileLegacy": "%s",\n  "githubActionLegacy": "%s",\n  "lightningStatusLegacy": "%s",\n  "lightningActionLegacy": "%s",\n  "runId": "%s"\n}\n' "$health" "$gh_status" "$gh_file" "$gh_action" "$li_status" "$li_action" "$GITHUB_RUN_ID" > ops/dashboard-route-consolidation-preview.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add ops/dashboard-route-consolidation-preview.json
          git commit -m "Record dashboard route consolidation preview probe"
          git push
