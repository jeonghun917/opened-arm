name: VELA compatibility-aware upgrade v1

on:
  push:
    branches: [vela-experiment-infra]
    paths:
      - 'experiments/vela-active-state/compat-aware-upgrade-v1/**'
      - '.github/workflows/vela-compat-aware-upgrade-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compat-aware:
    strategy:
      fail-fast: false
      matrix:
        compat_lambda: ['0.01', '0.10']
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vela-experiment-infra
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.2,<3' 'transformers>=4.57,<4.58'
      - name: Run compatibility-aware upgrade
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          VELA_COMPAT_LAMBDA: '${{ matrix.compat_lambda }}'
          VELA_RESULT_PATH: 'ops/vela-results/compat-aware-${{ matrix.compat_lambda }}-latest.json'
        run: python experiments/vela-active-state/compat-aware-upgrade-v1/mamba_compat_aware_upgrade.py
      - name: Commit result snapshot
        if: always()
        env:
          OUT: 'ops/vela-results/compat-aware-${{ matrix.compat_lambda }}-latest.json'
        run: |
          if [[ ! -f "$OUT" ]]; then
            mkdir -p ops/vela-results
            printf '{"status":"FAIL_BEFORE_RESULT","source_commit":"%s"}\n' "$GITHUB_SHA" > "$OUT"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          git diff --cached --quiet || git commit -m 'Record VELA compat-aware ${{ matrix.compat_lambda }} [skip ci]'
          for n in 1 2 3 4 5; do
            git pull --rebase origin vela-experiment-infra && git push origin HEAD:vela-experiment-infra && break
            sleep $((n*4))
          done
