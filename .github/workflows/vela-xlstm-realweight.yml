name: VELA xLSTM 164M real-weight state probe

on:
  push:
    branches: [vela-experiment-infra]
    paths:
      - 'experiments/vela-active-state/xlstm-realweight-v1/**'
      - '.github/workflows/vela-xlstm-realweight.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vela-xlstm-realweight
  cancel-in-progress: false

jobs:
  xlstm-realweight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vela-experiment-infra
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.2,<3' 'transformers>=4.57,<4.58' safetensors huggingface_hub
      - name: Run actual xLSTM checkpoint state probe
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          VELA_RESULT_PATH: ops/vela-results/xlstm-realweight-latest.json
        run: python experiments/vela-active-state/xlstm-realweight-v1/xlstm_164m_state_probe.py
      - name: Commit result snapshot
        if: always()
        run: |
          if [[ ! -f ops/vela-results/xlstm-realweight-latest.json ]]; then
            mkdir -p ops/vela-results
            printf '{"status":"FAIL_BEFORE_RESULT","source_commit":"%s"}\n' "$GITHUB_SHA" > ops/vela-results/xlstm-realweight-latest.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/vela-results/xlstm-realweight-latest.json
          git diff --cached --quiet || git commit -m 'Record VELA xLSTM real-weight probe [skip ci]'
          for n in 1 2 3 4; do
            git pull --rebase origin vela-experiment-infra && git push origin HEAD:vela-experiment-infra && break
            sleep $((n*3))
          done
